<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>ODE TO PILATES</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#F0E6DE;overflow-x:hidden;font-family:'Noto Sans KR',sans-serif}
input,select,textarea,button{font-family:'Noto Sans KR',sans-serif;font-size:14px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#C49A87;border-radius:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes slideR{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
@keyframes stampHit{0%{transform:scale(0) rotate(-20deg);opacity:0}55%{transform:scale(1.35) rotate(5deg);opacity:1}80%{transform:scale(.95) rotate(-1deg)}100%{transform:scale(1.08) rotate(0)}}
@keyframes stampNS{0%{transform:scale(0) rotate(10deg);opacity:0}60%{transform:scale(1.3) rotate(-3deg)}100%{transform:scale(1.08) rotate(0)}}
@keyframes checkPop{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes dotPulse{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(min-width:600px){.app-wrap{max-width:800px!important}.sig-canvas{height:260px!important}}
@media(min-width:900px){.app-wrap{max-width:960px!important}.sig-canvas{height:300px!important}}
@media(orientation:landscape) and (min-width:600px){.sig-canvas{height:220px!important}.sig-wrap{max-width:600px;margin:0 auto}}
.app-wrap{max-width:720px;margin:0 auto}
.af{animation:fadeUp .4s ease both}.as{animation:scaleIn .35s ease both}.ar{animation:slideR .35s ease both}
.btn{position:relative;overflow:hidden;cursor:pointer;border:none;outline:none;transition:transform .12s ease}.btn:active{transform:scale(.94)!important}
.card-act{transition:transform .12s ease;cursor:pointer}.card-act:active{transform:scale(.97)}
.dot-loading{display:inline-flex;gap:4px;align-items:center}.dot-loading span{width:6px;height:6px;border-radius:50%;background:#A47764;animation:dotPulse 1.2s infinite ease-in-out}.dot-loading span:nth-child(2){animation-delay:.15s}.dot-loading span:nth-child(3){animation-delay:.3s}
.spinner{width:32px;height:32px;border:3px solid #E0CBBD;border-top-color:#A47764;border-radius:50%;animation:spin .7s linear infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback,useMemo}=React;
const PIN="1234!";
const GS="https://script.google.com/macros/s/AKfycbx2DwNc8NT4jCCX8Jh1dtfMycKVnvIe7pSfJQ4lJ0MSyGo309ayYwN734ErzRJcMudz/exec";
const DK=["일","월","화","수","목","금","토"],WD=["월","화","수","목","금","토","일"];
const MCOL=["#A47764","#C0392B","#D35400","#E67E22","#F1C40F","#27AE60","#2980B9","#8E44AD","#2C3E50","#16A085","#E74C3C","#3498DB"];
const ROOMS=["","A","B"];
const HOURS=["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00"];
const fmt=s=>{if(!s)return"-";const d=new Date(s);return`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} (${DK[d.getDay()]})`};
const fmtShort=s=>{if(!s)return"-";const d=new Date(s);return`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`};
const fmtS=s=>{if(!s)return"-";const d=new Date(s);return`${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`};
const fmtT=s=>{if(!s)return"";const d=new Date(s);return`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
const td=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const isExp=dt=>dt&&new Date(dt)<new Date(td());
const dLeft=dt=>{if(!dt)return null;return Math.ceil((new Date(dt)-new Date(td()))/86400000)};
const vW=(t,f)=>{if(t===8&&f===1)return 10;if(t===16&&f===1)return 19;if(t===24&&f===1)return 28;if(t===8&&f===2)return 6;if(t===16&&f===2)return 11;if(t===24&&f===2)return 16;if(t===8&&f>=3)return 4;if(t===16&&f>=3)return 7;if(t===24&&f>=3)return 10;return Math.ceil(t/Math.max(f,1))+3};
const cExp=(first,tot,wD,pD=0)=>{if(!first)return null;const f=wD?.length||1;const w=vW(tot,f);const d=new Date(first);d.setDate(d.getDate()+w*7+(pD||0));return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const C={pri:"#A47764",priD:"#7D5A4A",priL:"#C49A87",priP:"#F5EDE8",priPP:"#FAF6F3",card:"#FFF",bdr:"#E0CBBD",txt:"#3D2B22",txtM:"#6B5548",txtL:"#9C8578",danger:"#C0392B",dangerBg:"#FDEDEB",warn:"#D4880F",warnBg:"#FEF6E7",pauseBg:"#F0ECE8",pauseTxt:"#9C8578",noshow:"#C0392B",noshowBg:"#FDEDEB",inst:"#5B7B6D",instBg:"#EDF4F0",ok:"#27ae60",okBg:"#eafaf1",stamp:"#8B2F3A",stampNS:"#999",roomA:"#2980B9",roomB:"#8E44AD",bg:"linear-gradient(180deg,#FAF6F3 0%,#F0E6DE 50%,#E8DDD4 100%)"};
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let _p=false;
async function pushG(u,m,r,i){if(!u||_p)return;_p=true;try{await fetch(u,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain"},body:JSON.stringify({members:m,records:r.map(x=>({...x,signature:null})),instructors:i,timestamp:new Date().toISOString()})})}catch{}finally{_p=false}}
async function pullG(u){if(!u)return null;try{const r=await fetch(u+"?t="+Date.now());return r.ok?await r.json():null}catch{return null}}

const inp={padding:"12px 14px",borderRadius:12,border:`1.5px solid ${C.bdr}`,fontSize:15,outline:"none",background:"white",color:C.txt,width:"100%",boxSizing:"border-box"};
const ovl={position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(50,30,20,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16};
const modal={background:"white",borderRadius:22,padding:24,boxShadow:"0 24px 64px rgba(125,90,74,.18)",width:"100%",maxWidth:560};

function Btn({children,primary,danger,small,full,style:s,...p}){return<button className="btn" style={{padding:small?"8px 16px":"14px 20px",borderRadius:small?10:14,fontSize:small?13:15,fontWeight:600,color:primary||danger?"white":C.txtM,background:danger?C.danger:primary?C.pri:"white",border:primary||danger?"none":`1.5px solid ${C.bdr}`,width:full?"100%":"auto",...s}} {...p}>{children}</button>}
function SyncDot({s}){if(s==="syncing")return<span className="dot-loading"><span/><span/><span/></span>;if(s==="idle")return null;return<span style={{fontSize:10,color:s==="success"?C.ok:C.danger,fontWeight:600,padding:"2px 6px",borderRadius:6,background:s==="success"?C.okBg:C.dangerBg}}>{s==="success"?"완료":"실패"}</span>}
function Badge({children,color,bg}){return<span style={{fontSize:10,padding:"2px 7px",borderRadius:6,fontWeight:600,color:color||C.inst,background:bg||C.instBg,whiteSpace:"nowrap"}}>{children}</span>}
function ColorPick({value,onChange}){return(<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{MCOL.map(c=>(<button key={c} className="btn" onClick={()=>onChange(c)} style={{width:24,height:24,borderRadius:"50%",background:c,border:value===c?"3px solid #3D2B22":"2px solid #E0CBBD"}}/>))}</div>)}
function DayPick({days,onChange}){return(<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{WD.map(d=>(<button key={d} className="btn" onClick={()=>onChange(days.includes(d)?days.filter(x=>x!==d):[...days,d])} style={{width:34,height:34,borderRadius:10,fontSize:12,fontWeight:600,border:days.includes(d)?"none":`1.5px solid ${C.bdr}`,background:days.includes(d)?C.pri:"white",color:days.includes(d)?"white":C.txtL}}>{d}</button>))}</div>)}
function SubSelect({instructors,mid,members,onChange,value}){const mb=members.find(m=>m.id===mid);const asgn=mb?.instructorId;const ai=instructors.filter(x=>x.status==="active");if(ai.length<=1)return null;return(<div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 0",flexWrap:"wrap"}}><span style={{fontSize:12,color:C.txtM,fontWeight:600}}>수업 강사:</span>{ai.map(inst=>{const sub=inst.id!==asgn;const on=value===inst.id;return(<Btn key={inst.id} small onClick={()=>onChange(inst.id)} style={{borderColor:on?(sub?C.warn:C.inst):C.bdr,background:on?(sub?C.warnBg:C.instBg):"white",color:on?(sub?C.warn:C.inst):C.txtL,padding:"5px 10px",fontSize:12}}>{inst.name}{sub&&on?" (대강)":""}</Btn>)})}</div>)}
function RoomBadge({room}){if(!room)return null;return<span style={{fontSize:9,fontWeight:800,padding:"1px 5px",borderRadius:3,color:"white",background:room==="A"?C.roomA:C.roomB}}>{room}</span>}

/* TimePick with conflict blocking */
function TimePick({value,onChange,takenTimes,compact,singleInst}){
  const sz=compact?{w:46,h:28,f:11,g:3,r:6}:{w:52,h:32,f:12,g:4,r:8};
  const taken=takenTimes||[];
  return(<div style={{display:"flex",gap:sz.g,flexWrap:"wrap"}}>{HOURS.map(h=>{const isTaken=taken.includes(h)&&h!==value;const sel=value===h;const blocked=isTaken&&singleInst;
    return(<button key={h} className="btn" onClick={()=>{if(blocked){alert(`${h}시에 이미 다른 수업이 있습니다`);return}onChange(sel?"":h)}} style={{width:sz.w,height:sz.h,borderRadius:sz.r,fontSize:sz.f,fontWeight:sel?700:500,border:sel?"none":`1px solid ${blocked?"#eee":C.bdr}`,background:sel?C.pri:blocked?"#e8e3de":"white",color:sel?"white":blocked?"#c5b8b0":C.txtM,textDecoration:blocked?"line-through":"none",cursor:blocked?"not-allowed":"pointer"}}>{h}</button>)})}</div>)}

const IcoSkip=({sz=13})=><svg width={sz} height={sz} viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/><path d="M17 3v6h6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoDel=({sz=13})=><svg width={sz} height={sz} viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4h8v2M5 6v14a2 2 0 002 2h10a2 2 0 002-2V6" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const IcoUndo=({sz=13})=><svg width={sz} height={sz} viewBox="0 0 24 24" fill="none"><path d="M3 10h10a5 5 0 010 10H9M3 10l4-4M3 10l4 4" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoCal=({sz=18})=><svg width={sz} height={sz} viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>;

/* Stamp */
function StampBar({total,used,animate,records,memberId,onDeleteNS}){const sz=total>12?26:total>8?30:36;const gap=total>12?4:total>8?5:7;const rem=total-used;
  const mr=(records||[]).filter(r=>r.memberId===memberId&&(r.type==="attended"||r.type==="noshow")).sort((a,b)=>(a.timestamp||"").localeCompare(b.timestamp||""));
  return(<div style={{padding:"10px 0"}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.txtM,marginBottom:6}}><span>수강권 {total}회</span><span style={{fontWeight:700,color:rem<=2?C.danger:C.priD}}>잔여 {rem}회</span></div>
    <div style={{display:"flex",gap,flexWrap:"wrap",justifyContent:"center",background:"white",borderRadius:16,padding:"14px 10px",border:`1px solid ${C.bdr}`}}>
      {Array.from({length:total}).map((_,i)=>{const rec=mr[i];const filled=i<used;const isLast=animate&&i===used-1;const isNS=rec?.type==="noshow";const col=isNS?C.stampNS:C.stamp;
        return(<div key={i} style={{position:"relative",width:sz,height:sz,cursor:isNS&&onDeleteNS?"pointer":"default"}} onClick={()=>{if(isNS&&onDeleteNS&&confirm("노쇼 삭제 + 횟수 복원?"))onDeleteNS(rec)}}>
          <div style={{width:sz,height:sz,borderRadius:"50%",border:`2px ${filled?"solid":"dashed"} ${filled?col:C.bdr}`,background:filled?"transparent":C.priP,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:sz*.32,fontWeight:700,color:C.priL,opacity:filled?0:.45,userSelect:"none"}}>{i+1}</span></div>
          {filled&&<div style={{position:"absolute",top:"-8%",left:"-8%",width:"116%",height:"116%",borderRadius:"50%",background:col,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",animation:isLast?(isNS?"stampNS .5s ease both":"stampHit .5s ease both"):"none",boxShadow:`0 2px 8px ${isNS?"rgba(100,100,100,.25)":"rgba(139,47,58,.3)"}`}}>
            {isNS?<><svg width={sz*.35} height={sz*.35} viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="white" strokeWidth="2.5" strokeLinecap="round"/></svg><span style={{fontSize:Math.max(sz*.16,6),color:"rgba(255,255,255,.7)",fontWeight:700,lineHeight:1,marginTop:1}}>NS</span></>:
            <svg width={sz*.5} height={sz*.5} viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
          </div>}
        </div>)})}
    </div></div>)}

/* Login + Loading */
function LoginScreen({onLogin}){const[p,setP]=useState("");const[err,setErr]=useState(false);const chk=()=>{if(p===PIN){sessionStorage.setItem("ode-auth","1");onLogin()}else{setErr(true);setP("");setTimeout(()=>setErr(false),1500)}};
  return(<div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}><div className="af" style={{textAlign:"center",width:"100%",maxWidth:360}}><div style={{fontSize:13,letterSpacing:6,color:C.priL,fontWeight:600,marginBottom:8}}>PILATES STUDIO</div><h1 style={{fontSize:26,fontWeight:900,color:C.priD,letterSpacing:3,margin:"0 0 40px"}}>ODE TO PILATES</h1><div className="as" style={{background:"white",borderRadius:22,padding:"32px 24px",boxShadow:"0 8px 40px rgba(125,90,74,.1)"}}><p style={{color:C.txtM,fontSize:14,margin:"0 0 18px",fontWeight:500}}>비밀번호를 입력해주세요</p><input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&chk()} placeholder="••••" style={{padding:16,borderRadius:14,border:err?`2px solid ${C.danger}`:`2px solid ${C.bdr}`,fontSize:26,textAlign:"center",width:"100%",outline:"none",fontFamily:"monospace",letterSpacing:10,color:C.txt,boxSizing:"border-box"}} autoFocus/>{err&&<p style={{color:C.danger,fontSize:13,fontWeight:600,margin:"10px 0 0"}}>비밀번호가 틀립니다</p>}<Btn primary full style={{marginTop:18,padding:"15px 0",fontSize:16}} onClick={chk}>로그인</Btn></div></div></div>)}
function LoadingGate({msg}){return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg}}><div style={{textAlign:"center"}}><div style={{fontSize:13,letterSpacing:6,color:C.priL,marginBottom:8}}>PILATES STUDIO</div><p style={{fontSize:24,fontWeight:900,color:C.priD,letterSpacing:3,margin:"0 0 24px"}}>ODE TO PILATES</p><div className="spinner" style={{margin:"0 auto 16px"}}/><p style={{color:C.txtM,fontSize:14,fontWeight:500}}>{msg}</p></div></div>)}

/* Signature */
function SigPad({onSave,onCancel}){const ref=useRef(null);const[dr,setDr]=useState(false);const[dn,setDn]=useState(false);
  const initCanvas=useCallback(()=>{const c=ref.current;if(!c)return;const x=c.getContext("2d"),r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;x.scale(2,2);x.strokeStyle=C.priD;x.lineWidth=2.5;x.lineCap="round";x.lineJoin="round"},[]);
  useEffect(()=>{initCanvas();const h=()=>{setTimeout(initCanvas,100)};window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h)},[initCanvas]);
  const gp=e=>{const r=ref.current.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};const ms=e=>{e.preventDefault();const x=ref.current.getContext("2d"),pp=gp(e);x.beginPath();x.moveTo(pp.x,pp.y);setDr(true);setDn(true)};const mm=e=>{e.preventDefault();if(!dr)return;const x=ref.current.getContext("2d"),pp=gp(e);x.lineTo(pp.x,pp.y);x.stroke()};const me=()=>setDr(false);const cl=()=>{ref.current.getContext("2d").clearRect(0,0,ref.current.width,ref.current.height);setDn(false)};
  return(<div className="sig-wrap" style={{display:"flex",flexDirection:"column",gap:10}}><div style={{border:`2px dashed ${C.priL}`,borderRadius:18,overflow:"hidden",background:"white",position:"relative"}}><canvas ref={ref} className="sig-canvas" style={{width:"100%",height:200,touchAction:"none",cursor:"crosshair"}} onMouseDown={ms} onMouseMove={mm} onMouseUp={me} onMouseLeave={me} onTouchStart={ms} onTouchMove={mm} onTouchEnd={me}/>{!dn&&<div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",textAlign:"center",pointerEvents:"none",zIndex:2}}><div style={{color:C.priL,fontSize:16,fontWeight:600}}>서명해주세요</div><div style={{color:C.bdr,fontSize:12,marginTop:6}}>손가락으로 자유롭게 서명하시면 됩니다</div></div>}</div><div style={{display:"flex",gap:8}}><Btn style={{flex:1}} onClick={onCancel}>취소</Btn><Btn style={{flex:1}} onClick={cl}>다시</Btn><Btn primary style={{flex:2,opacity:dn?1:.4}} onClick={()=>dn&&onSave(ref.current.toDataURL("image/png"))}>서명 완료</Btn></div></div>)}

/* History (with time display) */
function Hist({records,limit,instructors,onSkip,onUndoSkip,onDel,showAct}){const sh=limit?records.slice(-limit).reverse():records.slice().reverse();if(!sh.length)return<div style={{textAlign:"center",padding:16,color:C.txtL,fontSize:13}}>기록 없음</div>;
  return(<div style={{display:"flex",flexDirection:"column",gap:4}}>{sh.map((r,i)=>{const ns=r.type==="noshow";const sk=r.type==="skipped";const inst=instructors?.find(x=>x.id===r.instructorId);const tm=fmtT(r.timestamp);
    return(<div key={r.timestamp||i} className="ar" style={{animationDelay:`${i*.03}s`,padding:"9px 12px",borderRadius:10,background:ns?C.noshowBg:sk?"#f5f1ed":"white",border:`1px solid ${ns?"#f0c4bf":sk?C.warn+"40":C.bdr}`,display:"flex",justifyContent:"space-between",alignItems:"center",gap:6}}>
      <div style={{flex:1,minWidth:0}}><div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}><span style={{fontSize:11,color:ns?C.noshow:sk?C.warn:C.priD,fontWeight:800}}>#{sh.length-i}</span><span style={{fontSize:12,color:ns?C.noshow:C.txt,fontWeight:600}}>{fmt(r.date)}</span>{tm&&<span style={{fontSize:10,color:C.txtL}}>{tm}</span>}</div><div style={{display:"flex",alignItems:"center",gap:5,marginTop:1}}>{ns&&<span style={{fontSize:8,fontWeight:800,color:C.noshow,border:`1.5px solid ${C.noshow}`,borderRadius:3,padding:"0 3px"}}>NO SHOW</span>}{sk&&<span style={{fontSize:8,fontWeight:700,color:C.warn,border:`1.5px solid ${C.warn}`,borderRadius:3,padding:"0 3px"}}>SKIP</span>}{r.memberName&&<span style={{fontSize:10,color:C.txtM,fontWeight:600}}>{r.memberName}</span>}{inst&&<span style={{fontSize:10,color:C.inst}}>{inst.name}</span>}</div></div>
      {showAct&&<div style={{display:"flex",gap:3,flexShrink:0}}>
        {ns&&<><button className="btn" onClick={()=>onSkip?.(r)} style={{width:28,height:28,borderRadius:7,border:`1.5px solid ${C.warn}`,background:"white",color:C.warn,display:"flex",alignItems:"center",justifyContent:"center"}}><IcoSkip/></button><button className="btn" onClick={()=>onDel?.(r)} style={{width:28,height:28,borderRadius:7,border:`1.5px solid ${C.danger}`,background:"white",color:C.danger,display:"flex",alignItems:"center",justifyContent:"center"}}><IcoDel/></button></>}
        {sk&&<button className="btn" onClick={()=>onUndoSkip?.(r)} style={{width:28,height:28,borderRadius:7,border:`1.5px solid ${C.txtL}`,background:"white",color:C.txtM,display:"flex",alignItems:"center",justifyContent:"center"}}><IcoUndo/></button>}
      </div>}

/* Clock Daily View — Large pizza chart */
function ClockView({schedule,date}){
  const sz=340;const cx=sz/2;const cy=sz/2;const outerR=sz/2-20;const innerR=sz/2-80;
  const startH=8,endH=22,total=endH-startH;
  const toRad=deg=>(deg*Math.PI)/180;
  const hAngle=h=>((h-startH)/total)*360-90;
  const arcPath=(r,a1,a2)=>{const ra1=toRad(a1),ra2=toRad(a2);const x1=cx+Math.cos(ra1)*r,y1=cy+Math.sin(ra1)*r;const x2=cx+Math.cos(ra2)*r,y2=cy+Math.sin(ra2)*r;return{x1,y1,x2,y2}};
  const hasSchedule=schedule.filter(m=>m.displayTime).length>0;
  return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"10px 0"}}>
    <div style={{fontSize:16,fontWeight:800,marginBottom:12,color:C.txt}}>{fmt(date)}</div>
    <div style={{position:"relative",width:sz+40,height:sz+40}}>
      <svg width={sz+40} height={sz+40} viewBox={`-20 -20 ${sz+40} ${sz+40}`}>
        {/* Outer ring */}
        <circle cx={cx} cy={cy} r={outerR} fill="#faf8f6" stroke={C.bdr} strokeWidth="2"/>
        <circle cx={cx} cy={cy} r={innerR} fill="white" stroke={C.bdr} strokeWidth="1"/>
        {/* Hour grid lines and labels 8~21 */}
        {Array.from({length:total}).map((_,i)=>{const h=startH+i;const a=hAngle(h);const ra=toRad(a);
          const ox=cx+Math.cos(ra)*outerR,oy=cy+Math.sin(ra)*outerR;
          const ix=cx+Math.cos(ra)*innerR,iy=cy+Math.sin(ra)*innerR;
          const lx=cx+Math.cos(ra)*(outerR+14),ly=cy+Math.sin(ra)*(outerR+14);
          const hasSess=schedule.some(m=>m.displayTime&&parseInt(m.displayTime)=== h);
          return(<g key={h}>
            <line x1={ix} y1={iy} x2={ox} y2={oy} stroke={C.bdr} strokeWidth="1" strokeDasharray={hasSess?"":"3 3"}/>
            <text x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="12" fontWeight={hasSess?"800":"500"} fill={hasSess?C.priD:C.txtL}>{h}</text>
          </g>)})}
        {/* Pizza slices for sessions */}
        {schedule.map((m,i)=>{if(!m.displayTime)return null;
          const hr=parseInt(m.displayTime.split(":")[0]);
          const a1=hAngle(hr),a2=hAngle(hr+1);
          const o1=arcPath(outerR-1,a1,a2),i1=arcPath(innerR+1,a1,a2);
          const mc=m.color||C.pri;
          const midA=toRad((a1+a2)/2);
          const labelR=(outerR+innerR)/2;
          const lx=cx+Math.cos(midA)*labelR,ly=cy+Math.sin(midA)*labelR;
          const fill=m.done?mc:m.noshow?C.noshow:mc;
          const opacity=m.done?1:m.noshow?.8:.25;
          return(<g key={m.id}>
            <path d={`M${i1.x1},${i1.y1} L${o1.x1},${o1.y1} A${outerR-1},${outerR-1} 0 0,1 ${o1.x2},${o1.y2} L${i1.x2},${i1.y2} A${innerR+1},${innerR+1} 0 0,0 ${i1.x1},${i1.y1}`} fill={fill} opacity={opacity} stroke={mc} strokeWidth="2"/>
            <text x={lx} y={ly-6} textAnchor="middle" dominantBaseline="middle" fontSize="11" fontWeight="800" fill={m.done||m.noshow?"white":mc}>{m.name}</text>
            <text x={lx} y={ly+7} textAnchor="middle" dominantBaseline="middle" fontSize="9" fontWeight="600" fill={m.done||m.noshow?"rgba(255,255,255,.8)":C.txtM}>{m.displayTime}</text>
            {m.displayRoom&&<text x={lx} y={ly+18} textAnchor="middle" fontSize="8" fontWeight="800" fill={m.done?"rgba(255,255,255,.9)":m.displayRoom==="A"?C.roomA:C.roomB}>{m.displayRoom}실</text>}
          </g>)})}
        {/* Center */}
        <circle cx={cx} cy={cy} r={innerR-1} fill="white"/>
        <text x={cx} y={cy-8} textAnchor="middle" fontSize="13" fontWeight="800" fill={C.priD}>{schedule.length}명</text>
        <text x={cx} y={cy+8} textAnchor="middle" fontSize="10" fill={C.txtL}>수업</text>
      </svg>
    </div>
    {/* Legend below */}
    {schedule.length>0&&<div style={{display:"flex",flexDirection:"column",gap:6,marginTop:8,width:"100%",maxWidth:360}}>
      {schedule.map(m=>{const mc=m.color||C.pri;return(<div key={m.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderRadius:10,background:"white",border:`1px solid ${C.bdr}`,borderLeft:`4px solid ${mc}`}}>
        <span style={{fontSize:13,fontWeight:800,color:mc,minWidth:45}}>{m.displayTime||"--:--"}</span>
        <span style={{fontSize:13,fontWeight:700,flex:1}}>{m.name}</span>
        {m.displayRoom&&<RoomBadge room={m.displayRoom}/>}
        <span style={{fontSize:11,color:m.done?C.ok:m.noshow?C.noshow:C.txtL,fontWeight:600}}>{m.done?"완료":m.noshow?"노쇼":"예정"}</span>
      </div>)})}
    </div>}
    {schedule.filter(m=>!m.displayTime).length>0&&<div style={{marginTop:8,fontSize:12,color:C.warn,fontWeight:600,background:C.warnBg,padding:"6px 12px",borderRadius:8}}>시간 미설정: {schedule.filter(m=>!m.displayTime).map(m=>m.name).join(", ")}</div>}
  </div>)
}

  </div>)
}
function Calendar({members,records,instructors,onUpM}){

  const[fInst,setFInst]=useState("all");const[dayMode,setDayMode]=useState("timeline");
  const aI=instructors.filter(x=>x.status==="active");
  const singleInst=aI.length<=1;
  const targetM=fInst==="all"?members.filter(m=>m.status==="active"):members.filter(m=>m.instructorId===fInst&&m.status==="active");

  const weekStart=useMemo(()=>{const d=new Date(base);const day=d.getDay()||7;d.setDate(d.getDate()-day+1);d.setHours(0,0,0,0);return d},[base]);
  const weekDates=useMemo(()=>Array.from({length:7}).map((_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d}),[weekStart]);
  const monthStart=useMemo(()=>new Date(base.getFullYear(),base.getMonth(),1),[base]);
  const monthDates=useMemo(()=>{const d=[];const y=monthStart.getFullYear(),mo=monthStart.getMonth();const first=new Date(y,mo,1);const sd=(first.getDay()||7)-1;for(let i=-sd;i<42-sd;i++){d.push(new Date(y,mo,1+i))}return d},[monthStart]);
  const fmtD=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const today=td();

  const getSched=ds=>{const wd=DK[new Date(ds).getDay()];const result=[];targetM.forEach(m=>{const ov=m.scheduleOverrides||[];const isDef=m.weeklyDays?.includes(wd);const removed=ov.some(o=>o.date===ds&&o.type==="remove");const addOv=ov.find(o=>o.date===ds&&o.type==="add");const timeOv=ov.find(o=>o.date===ds&&o.time!==undefined);
    if((isDef&&!removed)||addOv){const done=records.some(r=>r.memberId===m.id&&r.date===ds&&r.type==="attended");const ns=records.some(r=>r.memberId===m.id&&r.date===ds&&r.type==="noshow");const dt=addOv?.time||timeOv?.time||m.classTime||"";const rm=addOv?.room||timeOv?.room||m.room||"";const inst=instructors.find(x=>x.id===m.instructorId);
      result.push({...m,done,noshow:ns,isExtra:!!addOv&&!isDef,displayTime:dt,displayRoom:rm,instName:inst?.name||""})}});
    return result.sort((a,b)=>(a.displayTime||"99:99").localeCompare(b.displayTime||"99:99"))};

  const removeFrom=(mid,ds)=>{const m=members.find(x=>x.id===mid);if(!m)return;const wd=DK[new Date(ds).getDay()];let nv=[...(m.scheduleOverrides||[])];if(m.weeklyDays?.includes(wd)){if(!nv.some(o=>o.date===ds&&o.type==="remove"))nv.push({date:ds,type:"remove"})}else nv=nv.filter(o=>!(o.date===ds&&o.type==="add"));onUpM(members.map(x=>x.id===mid?{...x,scheduleOverrides:nv}:x))};
  const addTo=(mid,ds)=>{const m=members.find(x=>x.id===mid);if(!m)return;let nv=[...(m.scheduleOverrides||[])];const wd=DK[new Date(ds).getDay()];if(m.weeklyDays?.includes(wd))nv=nv.filter(o=>!(o.date===ds&&o.type==="remove"));else{if(!nv.some(o=>o.date===ds&&o.type==="add"))nv.push({date:ds,type:"add",time:m.classTime||"",room:m.room||""})}onUpM(members.map(x=>x.id===mid?{...x,scheduleOverrides:nv}:x));setAddMod(null)};
  const moveClass=(mid,from,to)=>{if(!to)return;const m=members.find(x=>x.id===mid);if(!m)return;let nv=[...(m.scheduleOverrides||[])];const wdF=DK[new Date(from).getDay()];if(m.weeklyDays?.includes(wdF)){if(!nv.some(o=>o.date===from&&o.type==="remove"))nv.push({date:from,type:"remove"})}else nv=nv.filter(o=>!(o.date===from&&o.type==="add"));const wdT=DK[new Date(to).getDay()];if(m.weeklyDays?.includes(wdT))nv=nv.filter(o=>!(o.date===to&&o.type==="remove"));else{if(!nv.some(o=>o.date===to&&o.type==="add"))nv.push({date:to,type:"add",time:m.classTime||"",room:m.room||""})}onUpM(members.map(x=>x.id===mid?{...x,scheduleOverrides:nv}:x));setMoveMod(null)};
  const saveOv=(mid,ds,time,room)=>{const m=members.find(x=>x.id===mid);if(!m)return;let nv=[...(m.scheduleOverrides||[])];const idx=nv.findIndex(o=>o.date===ds);if(idx>=0){nv[idx]={...nv[idx],time,room}}else{const wd=DK[new Date(ds).getDay()];if(m.weeklyDays?.includes(wd))nv.push({date:ds,type:"timeChange",time,room});else{const ai=nv.findIndex(o=>o.date===ds&&o.type==="add");if(ai>=0)nv[ai]={...nv[ai],time,room}}}onUpM(members.map(x=>x.id===mid?{...x,scheduleOverrides:nv}:x))};
  const nav=dir=>{const d=new Date(base);if(view==="month")d.setMonth(d.getMonth()+dir);else if(view==="week")d.setDate(d.getDate()+dir*7);else d.setDate(d.getDate()+dir);setBase(d);setPanelDate(null)};

        {sc.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{sc.map(m=>{const mc=m.color||C.pri;return(<span key={m.id} style={{fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:8,color:m.done?"white":m.noshow?"white":mc,background:m.done?mc:m.noshow?C.noshow:"white",border:`1.5px solid ${m.done?mc:m.noshow?C.noshow:mc}`,display:"inline-flex",alignItems:"center",gap:3}}>

    {moveMod&&<MoveModal fromDate={moveMod.fromDate} memberId={moveMod.memberId} members={members} onMove={moveClass} onClose={()=>setMoveMod(null)}/>}
  </div>)
}

/* ═══ Admin ═══ */
function Admin({members,onUpM,onClose,records,onUpR,instructors,onUpI,sync,onSync,skipNS,undoSkip,delNS}){
  const[eid,setEid]=useState(null);const[showAdd,setShowAdd]=useState(false);
  const[nn,setNn]=useState("");const[np,setNp]=useState("");const[nt,setNt]=useState(8);const[nd,setNd]=useState([]);const[nf,setNf]=useState("");const[ni,setNi]=useState("");const[nc,setNc]=useState(MCOL[0]);const[ntime,setNtime]=useState("");

  const startE=m=>{setEid(m.id);setEv({name:m.name,phone:m.phone||"",totalSessions:m.totalSessions,weeklyDays:[...(m.weeklyDays||[])],firstClassDate:m.firstClassDate||"",expiryDate:m.expiryDate||"",instructorId:m.instructorId||"",color:m.color||C.pri,classTime:m.classTime||"",room:m.room||""})};
  const saveE=id=>{const m=members.find(x=>x.id===id);const ne=ev.firstClassDate?cExp(ev.firstClassDate,parseInt(ev.totalSessions),ev.weeklyDays,m.pausedDays||0):ev.expiryDate||null;onUpM(members.map(x=>x.id===id?{...x,name:ev.name||x.name,phone:ev.phone??x.phone,totalSessions:parseInt(ev.totalSessions)||x.totalSessions,weeklyDays:ev.weeklyDays,firstClassDate:ev.firstClassDate||x.firstClassDate,expiryDate:ne,instructorId:ev.instructorId||null,color:ev.color,classTime:ev.classTime||null,room:ev.room||""}:x));setEid(null)};

  const resumeM=id=>{const m=members.find(x=>x.id===id);if(!m||m.status!=="paused")return;const pd=m.pauseStartDate?Math.max(0,Math.ceil((new Date(td())-new Date(m.pauseStartDate))/86400000)):0;const tp=(m.pausedDays||0)+pd;const ne=m.firstClassDate?cExp(m.firstClassDate,m.totalSessions,m.weeklyDays,tp):m.expiryDate?(()=>{const d=new Date(m.expiryDate);d.setDate(d.getDate()+pd);return d.toISOString().slice(0,10)})():null;onUpM(members.map(x=>x.id===id?{...x,status:"active",pauseReason:null,pauseStartDate:null,pausedDays:tp,expiryDate:ne}:x))};
  // RENEW: add sessions to existing total
  const hRenew=(mb,data)=>{const newTotal=mb.totalSessions+data.sessions;const ne=cExp(data.startDate,newTotal,data.weeklyDays);onUpM(members.map(m=>m.id===mb.id?{...m,totalSessions:newTotal,weeklyDays:data.weeklyDays,firstClassDate:data.startDate,expiryDate:ne,renewals:[...(m.renewals||[]),{date:td(),addedSessions:data.sessions,newTotal,weeklyDays:[...data.weeklyDays],startDate:data.startDate}]}:m));setRenM(null)};
  const addI=()=>{if(!newIN.trim())return;onUpI([...instructors,{id:Date.now().toString(),name:newIN.trim(),role:aI.length===0?"원장":"강사",status:"active",createdAt:td()}]);setNewIN("")};
  // Delete instructor requires transfer
  const delI=id=>{const mc=members.filter(m=>m.instructorId===id);if(mc.length>0){setTfI(instructors.find(x=>x.id===id));return}if(!confirm("삭제?"))return;onUpI(instructors.filter(x=>x.id!==id))};
  const hTf=(mids,toId)=>{onUpM(members.map(m=>mids.includes(m.id)?{...m,instructorId:toId}:m));const fromId=tfI?.id;if(fromId)onUpI(instructors.filter(x=>x.id!==fromId));setTfI(null)};
  const copyKakao=(m)=>{const rem=m.totalSessions-m.usedSessions;const inst=instructors.find(x=>x.id===m.instructorId);const txt=`[ODE TO PILATES]\n${m.name} 회원님 수강 정보 안내\n\n잔여 횟수: ${rem}회 / ${m.totalSessions}회\n유효기간: ${m.expiryDate?fmtShort(m.expiryDate):"미정"}\n담당 강사: ${inst?(inst.role==="원장"?inst.role+" ":"")+inst.name:"미배정"}\n\n감사합니다.`;navigator.clipboard.writeText(txt).then(()=>alert("복사 완료! 카톡에 붙여넣기 하세요")).catch(()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);alert("복사 완료!")})};

  return(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(50,30,20,.45)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:100,padding:"10px 6px",overflowY:"auto"}} onClick={onClose}>

              <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}><span style={{fontSize:11,color:C.txtM,fontWeight:600}}>강의실</span>{ROOMS.map(r=>(<button key={r} className="btn" onClick={()=>setEv({...ev,room:r})} style={{padding:"4px 10px",borderRadius:7,fontSize:11,fontWeight:ev.room===r?700:500,border:ev.room===r?"none":`1px solid ${C.bdr}`,background:ev.room===r?(r==="A"?C.roomA:r==="B"?C.roomB:C.pri):"white",color:ev.room===r?"white":C.txtM}}>{r||"미지정"}</button>))}<span style={{fontSize:11,color:C.txtM,fontWeight:600,marginLeft:6}}>강사</span>{aI.map(inst=>(<button key={inst.id} className="btn" onClick={()=>setEv({...ev,instructorId:inst.id})} style={{padding:"4px 10px",borderRadius:7,fontSize:11,fontWeight:ev.instructorId===inst.id?700:500,border:ev.instructorId===inst.id?"none":`1px solid ${C.bdr}`,background:ev.instructorId===inst.id?C.inst:"white",color:ev.instructorId===inst.id?"white":C.txtL}}>{inst.name}</button>))}</div>
              <div style={{display:"flex",alignItems:"center",gap:3}}><span style={{fontSize:11,color:C.txtM,fontWeight:600,flexShrink:0}}>색상</span><div style={{display:"flex",gap:2,flexWrap:"wrap"}}>{MCOL.map(c=>(<button key={c} className="btn" onClick={()=>setEv({...ev,color:c})} style={{width:18,height:18,borderRadius:"50%",background:c,border:ev.color===c?"2px solid #3D2B22":"1.5px solid #E0CBBD"}}/>))}</div></div>
              <div style={{display:"flex",gap:4}}><Btn primary small style={{padding:"6px 16px",fontSize:12}} onClick={()=>saveE(m.id)}>저장</Btn><Btn small style={{padding:"6px 12px",fontSize:12}} onClick={()=>setEid(null)}>취소</Btn></div>
            </div>):(<div>
              <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap",marginBottom:2}}><span style={{fontWeight:800,fontSize:14}}>{m.name}</span>{pa&&<Badge color={C.warn} bg={C.warnBg}>중지</Badge>}{inst&&<Badge>{inst.name}</Badge>}{m.classTime&&<span style={{fontSize:11,color:C.priD,background:C.priP,padding:"1px 6px",borderRadius:4}}>{m.classTime}</span>}{m.room&&<RoomBadge room={m.room}/>}</div>
              <div style={{fontSize:12,color:rem<=2?C.danger:C.priD,fontWeight:700}}>잔여 {rem}회 / {m.totalSessions}회{m.expiryDate&&<span style={{color:C.txtL,fontWeight:500}}> · ~{fmtShort(m.expiryDate)}</span>}</div>
              <div style={{display:"flex",gap:3,marginTop:8,flexWrap:"wrap"}}>
                <Btn small style={{background:C.priD,color:"white",border:"none",padding:"5px 10px",fontSize:11}} onClick={()=>setRenM(m)}>연장</Btn>
                {pa?<Btn small style={{background:C.ok,color:"white",border:"none",padding:"5px 10px",fontSize:11}} onClick={()=>resumeM(m.id)}>재개</Btn>:<Btn small style={{color:C.warn,borderColor:C.warn,padding:"5px 10px",fontSize:11}} onClick={()=>setPm(m)}>중지</Btn>}
                <Btn small style={{padding:"5px 10px",fontSize:11}} onClick={()=>{setVr(m.id);setTab("records")}}>기록</Btn>
                <Btn small style={{padding:"5px 10px",fontSize:11,color:"#3B1E1E",background:"#FEE500",border:"none"}} onClick={()=>copyKakao(m)}>카톡복사</Btn>
                <Btn small style={{padding:"5px 10px",fontSize:11}} onClick={()=>startE(m)}>수정</Btn>
                <Btn small style={{color:C.txtL,borderColor:C.bdr,padding:"5px 10px",fontSize:11}} onClick={()=>{if(confirm(`${m.name} 회원을 비활성 처리합니다`))onUpM(members.map(x=>x.id===m.id?{...x,status:"inactive"}:x))}}>비활성</Btn>
                <Btn small style={{color:C.danger,borderColor:"#f0c4bf",padding:"5px 10px",fontSize:11}} onClick={()=>delM(m.id)}>삭제</Btn>
              </div></div>)}
          </div>)})}</div>
        {/* Inactive members */}
        {members.filter(m=>m.status==="inactive").length>0&&<div style={{marginTop:14}}>
          <p style={{fontSize:12,color:C.txtL,fontWeight:700,margin:"0 0 6px"}}>비활성 회원 ({members.filter(m=>m.status==="inactive").length}명)</p>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>{members.filter(m=>m.status==="inactive").map(m=>{const inst=instructors.find(x=>x.id===m.instructorId);
            return(<div key={m.id} style={{padding:"8px 12px",borderRadius:10,background:"#f5f1ed",border:"1px solid #e0dbd6",display:"flex",justifyContent:"space-between",alignItems:"center",opacity:.6}}>
              <div><span style={{fontSize:13,fontWeight:700,color:C.txtM}}>{m.name}</span>{inst&&<span style={{fontSize:10,color:C.txtL,marginLeft:4}}>{inst.name}</span>}<span style={{fontSize:11,color:C.txtL,marginLeft:4}}>{m.totalSessions-m.usedSessions}회 남음</span></div>
              <div style={{display:"flex",gap:3}}>
                <Btn small style={{padding:"4px 10px",fontSize:10,background:C.ok,color:"white",border:"none"}} onClick={()=>onUpM(members.map(x=>x.id===m.id?{...x,status:"active"}:x))}>활성</Btn>
                <Btn small style={{padding:"4px 10px",fontSize:10,color:C.danger,borderColor:"#f0c4bf"}} onClick={()=>delM(m.id)}>삭제</Btn>
              </div>
            </div>)})}</div>
        </div>}
        </>}</>}

      {tab==="instructors"&&<div>
        <div className="af" style={{background:C.instBg,borderRadius:14,padding:14,marginBottom:14}}><div style={{display:"flex",gap:6}}><input placeholder="이름" value={newIN} onChange={e=>setNewIN(e.target.value)} style={{...inp,flex:1}} onKeyDown={e=>e.key==="Enter"&&addI()}/><Btn primary small onClick={addI}>추가</Btn></div></div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>{instructors.map(inst=>{const mc=members.filter(m=>m.instructorId===inst.id&&m.status==="active").length;return(<div key={inst.id} className="ar" style={{background:"white",borderRadius:12,padding:12,border:`1px solid ${C.bdr}`}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><span style={{fontSize:14,fontWeight:800}}>{inst.name}</span> <Badge color={inst.role==="원장"?C.priD:C.inst} bg={inst.role==="원장"?C.priP:C.instBg}>{inst.role}</Badge> <span style={{fontSize:12,color:C.inst}}>({mc}명)</span></div><div style={{display:"flex",gap:3}}>{mc>0&&aI.length>1&&<Btn small style={{color:C.inst,borderColor:C.inst,padding:"5px 8px",fontSize:10}} onClick={()=>setTfI(inst)}>양도</Btn>}<Btn small style={{color:C.danger,borderColor:"#f0c4bf",padding:"5px 8px",fontSize:10}} onClick={()=>delI(inst.id)}>삭제</Btn></div></div></div>)})}</div></div>}

      {tab==="records"&&<div>{vr&&<div style={{marginBottom:8}}><Btn small onClick={()=>setVr(null)}>← 전체</Btn><span style={{marginLeft:8,fontSize:13,fontWeight:700}}>{members.find(m=>m.id===vr)?.name}</span></div>}<Hist records={vr?records.filter(r=>r.memberId===vr):records} limit={50} instructors={instructors} showAct={true} onSkip={skipNS} onUndoSkip={undoSkip} onDel={delNS}/></div>}

      {tab==="sheets"&&<div className="af" style={{background:C.priP,borderRadius:14,padding:18,textAlign:"center"}}><SyncDot s={sync}/><p style={{fontSize:13,color:C.txtM,margin:"10px 0"}}>구글 스프레드시트 동기화</p><Btn primary full style={{padding:"14px 0",fontSize:15}} onClick={onSync}>동기화</Btn></div>}

      {pm&&<PauseModal mb={pm} onOk={r=>pauseM(pm.id,r)} onNo={()=>setPm(null)}/>}
      {tfI&&<TransferModal members={members} instructors={instructors} from={tfI} onOk={hTf} onNo={()=>setTfI(null)}/>}
      {renM&&<RenewModal mb={renM} onOk={d=>hRenew(renM,d)} onNo={()=>setRenM(null)}/>}
    </div>
  </div>)
}

/* ═══ APP ═══ */
function App(){
  const[auth,setAuth]=useState(()=>sessionStorage.getItem("ode-auth")==="1");
  const[members,setMembers]=useState([]);const[records,setRecords]=useState([]);const[instructors,setInstructors]=useState([]);
  const[sel,setSel]=useState(null);const[screen,setScreen]=useState("select");const[showAdmin,setShowAdmin]=useState(false);
  const[loading,setLoading]=useState(true);const[loadMsg]=useState("구글 스프레드시트 동기화 중...");
  const[search,setSearch]=useState("");const[sortBy,setSortBy]=useState("expiry");const[filterI,setFilterI]=useState("all");
  const[sync,setSync]=useState("idle");const[histM,setHistM]=useState(null);const[signI,setSignI]=useState(null);
  const[calOpen,setCalOpen]=useState(false);

  const save=useCallback((m,r,i)=>{LS.set("ode-m",m);LS.set("ode-r",r);LS.set("ode-i",i);pushG(GS,m,r,i)},[]);
  const upM=useCallback(nm=>{setMembers(nm);save(nm,records,instructors)},[records,instructors,save]);
  const upR=useCallback(nr=>{setRecords(nr);save(members,nr,instructors)},[members,instructors,save]);
  const upI=useCallback(ni=>{setInstructors(ni);save(members,records,ni)},[members,records,save]);

  const fullSync=useCallback(async(lm,lr,li)=>{setSync("syncing");const g=await pullG(GS);if(g?.success){const gm=g.members||[],gr=g.records||[],gi=g.instructors||[];const gIds=new Set(gm.map(x=>x.id));const fm=[...gm,...lm.filter(x=>!gIds.has(x.id))];const gTs=new Set(gr.map(x=>x.timestamp));const fr=[...gr,...lr.filter(x=>x.timestamp&&!gTs.has(x.timestamp))];const gI=new Set(gi.map(x=>x.id));const fi=[...gi,...li.filter(x=>!gI.has(x.id))];setMembers(fm);setRecords(fr);setInstructors(fi);LS.set("ode-m",fm);LS.set("ode-r",fr);LS.set("ode-i",fi);await pushG(GS,fm,fr,fi);setSync("success");setTimeout(()=>setSync("idle"),3000);return{m:fm,r:fr,i:fi}}setSync("error");setTimeout(()=>setSync("idle"),3000);return{m:lm,r:lr,i:li}},[]);

  useEffect(()=>{if(!auth){setLoading(false);return}const lm=LS.get("ode-m")||[],lr=LS.get("ode-r")||[],li=LS.get("ode-i")||[];setMembers(lm);setRecords(lr);setInstructors(li);if(lm.length||lr.length||li.length){setLoading(false);fullSync(lm,lr,li)}else{setLoading(true);fullSync(lm,lr,li).then(()=>setLoading(false)).catch(()=>setLoading(false))}},[auth]);
  const manualSync=useCallback(()=>{fullSync(members,records,instructors)},[members,records,instructors,fullSync]);

  const skipNS=r=>{const nr=records.map(x=>x.timestamp===r.timestamp?{...x,type:"skipped"}:x);const nm=members.map(m=>m.id===r.memberId?{...m,usedSessions:Math.max(0,m.usedSessions-1)}:m);setRecords(nr);setMembers(nm);save(nm,nr,instructors);setHistM(p=>p?nm.find(m=>m.id===p.id)||p:p)};
  const undoSkip=r=>{if(!confirm("스킵 취소 → 노쇼 복원"))return;const nr=records.map(x=>x.timestamp===r.timestamp?{...x,type:"noshow"}:x);const nm=members.map(m=>m.id===r.memberId?{...m,usedSessions:m.usedSessions+1}:m);setRecords(nr);setMembers(nm);save(nm,nr,instructors);setHistM(p=>p?nm.find(m=>m.id===p.id)||p:p)};
  const delNS=r=>{if(!confirm("삭제 + 횟수 복원"))return;const nr=records.filter(x=>x.timestamp!==r.timestamp);const nm=members.map(m=>m.id===r.memberId?{...m,usedSessions:Math.max(0,m.usedSessions-1)}:m);setRecords(nr);setMembers(nm);save(nm,nr,instructors);setHistM(p=>p?nm.find(m=>m.id===p.id)||p:p)};
  const delNSStamp=r=>{const nr=records.filter(x=>x.timestamp!==r.timestamp);const nm=members.map(m=>m.id===r.memberId?{...m,usedSessions:Math.max(0,m.usedSessions-1)}:m);setRecords(nr);setMembers(nm);save(nm,nr,instructors);setSel(p=>p?nm.find(m=>m.id===p.id)||p:p);setHistM(p=>p?nm.find(m=>m.id===p.id)||p:p)};
  const hNS=mid=>{const m=members.find(x=>x.id===mid);if(!m)return;const isF=m.usedSessions===0&&!m.firstClassDate;let um;if(isF){const exp=cExp(td(),m.totalSessions,m.weeklyDays);um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1,firstClassDate:td(),expiryDate:exp}:x)}else um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1}:x);const nr=[...records,{memberId:m.id,memberName:m.name,date:td(),type:"noshow",signature:null,instructorId:m.instructorId,isSubstitute:false,timestamp:new Date().toISOString()}];setMembers(um);setRecords(nr);save(um,nr,instructors);setSel(um.find(x=>x.id===m.id))};
  const hSign=sig=>{const m=members.find(x=>x.id===sel.id);if(!m)return;const isF=m.usedSessions===0&&!m.firstClassDate;let um;if(isF){const exp=cExp(td(),m.totalSessions,m.weeklyDays);um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1,firstClassDate:td(),expiryDate:exp}:x)}else um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1}:x);const aId=signI||m.instructorId;const sub=aId&&aId!==m.instructorId;const nr=[...records,{memberId:m.id,memberName:m.name,date:td(),type:"attended",signature:sig,instructorId:aId||null,isSubstitute:sub,timestamp:new Date().toISOString()}];setMembers(um);setRecords(nr);save(um,nr,instructors);setSel(um.find(x=>x.id===m.id));setScreen("result");setSignI(null)};
  const goHome=()=>{setScreen("select");setSel(null);setSearch("");setSignI(null);setCalOpen(false)};
  const logout=()=>{sessionStorage.removeItem("ode-auth");setAuth(false)};

  if(!auth)return<LoginScreen onLogin={()=>setAuth(true)}/>;
  if(loading)return<LoadingGate msg={loadMsg}/>;

  const active=members.filter(m=>m.status==="active"),paused=members.filter(m=>m.status==="paused"),inactive=members.filter(m=>m.status==="inactive");
  const aI=instructors.filter(x=>x.status==="active");
  const sorted=[...active].sort((a,b)=>{if(sortBy==="expiry"){if(!a.expiryDate&&!b.expiryDate)return 0;if(!a.expiryDate)return 1;if(!b.expiryDate)return-1;return new Date(a.expiryDate)-new Date(b.expiryDate)}if(sortBy==="name")return a.name.localeCompare(b.name,"ko");if(sortBy==="remaining")return(a.totalSessions-a.usedSessions)-(b.totalSessions-b.usedSessions);return 0});
  const filtered=sorted.filter(m=>m.name.includes(search)).filter(m=>filterI==="all"||m.instructorId===filterI);

  return(<div className="app-wrap" style={{minHeight:"100vh",background:C.bg}}>
    <div style={{padding:"10px 14px",borderBottom:`1px solid ${C.bdr}`,background:"rgba(255,255,255,.75)",backdropFilter:"blur(10px)",display:"flex",justifyContent:"space-between",alignItems:"center",gap:4}}>
      <div style={{display:"flex",alignItems:"center",gap:6}}>{(screen!=="select"||calOpen)&&<Btn small onClick={goHome} style={{padding:"5px 8px",flexShrink:0}}>←</Btn>}<span style={{fontSize:13,fontWeight:900,color:C.priD,letterSpacing:2}}>ODE TO PILATES</span></div>
      <div style={{display:"flex",gap:4,alignItems:"center",flexShrink:0}}>
        <SyncDot s={sync}/>
        {screen==="select"&&!calOpen&&<button className="btn" onClick={()=>setCalOpen(true)} style={{width:32,height:32,borderRadius:9,border:`1.5px solid ${C.bdr}`,background:"white",color:C.inst,display:"flex",alignItems:"center",justifyContent:"center"}}><IcoCal sz={16}/></button>}
        <Btn small onClick={()=>setShowAdmin(true)} style={{padding:"5px 12px",fontSize:11}}>관리</Btn>
        <div style={{width:1,height:20,background:C.bdr,margin:"0 2px"}}/>
        <Btn small onClick={logout} style={{padding:"5px 8px",fontSize:10,color:C.txtL}}>로그아웃</Btn>
      </div>
    </div>
    <div style={{padding:"14px 12px",minHeight:"calc(100vh - 56px)",display:"flex",flexDirection:"column"}}>
      {calOpen&&screen==="select"&&<Calendar members={members} records={records} instructors={instructors} onUpM={upM}/>}
      {screen==="select"&&!calOpen&&<div className="af" style={{flex:1}}>
        <p style={{fontSize:15,color:C.txt,fontWeight:700,marginBottom:8,textAlign:"center"}}>이름을 선택해주세요</p>
        <input placeholder="검색" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,padding:"10px 14px",marginBottom:8}}/>
        <div style={{display:"flex",gap:3,flexWrap:"wrap",marginBottom:10,alignItems:"center"}}><select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{padding:"5px 8px",borderRadius:8,border:`1px solid ${C.bdr}`,fontSize:11,background:"white"}}><option value="expiry">만료임박순</option><option value="name">가나다순</option><option value="remaining">잔여적은순</option></select>{aI.length>0&&[{id:"all",name:"전체"},...aI].map(x=>(<Btn key={x.id} small onClick={()=>setFilterI(x.id)} style={{padding:"4px 10px",fontSize:10,background:filterI===x.id?(x.id==="all"?C.priD:C.inst):"white",color:filterI===x.id?"white":C.txtL,borderColor:filterI===x.id?(x.id==="all"?C.priD:C.inst):C.bdr}}>{x.name}</Btn>))}</div>
        {!members.length?<p style={{color:C.txtM,fontSize:13,textAlign:"center",padding:20}}>등록된 회원이 없습니다</p>:
        <><div style={{display:"flex",flexDirection:"column",gap:6}}>{filtered.map((m,i)=>{const rem=m.totalSessions-m.usedSessions;const exp=isExp(m.expiryDate);const off=rem<=0||exp;const days=dLeft(m.expiryDate);const inst=instructors.find(x=>x.id===m.instructorId);
          return(<div key={m.id} className="ar" style={{animationDelay:`${i*.03}s`,display:"flex",alignItems:"stretch",borderRadius:14,border:`1px solid ${off?"#f0c4bf":C.bdr}`,overflow:"hidden",background:off?"#FDF5F3":C.card,opacity:off?.4:1,borderLeft:`4px solid ${m.color||C.pri}`}}>
            <button className="card-act" onClick={()=>{if(off)return;setSel(m);setSignI(m.instructorId||null);setScreen("sign")}} style={{flex:1,display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 6px 12px 12px",border:"none",background:"transparent",textAlign:"left",minWidth:0}}>
              <div style={{flex:1,minWidth:0}}><div style={{display:"flex",alignItems:"baseline",gap:4,flexWrap:"wrap"}}><span style={{fontSize:15,fontWeight:800,color:C.txt}}>{m.name}</span><span style={{fontSize:12,fontWeight:400,color:C.txtL}}>회원님</span>{inst&&<Badge>{inst.name}</Badge>}</div>{m.weeklyDays?.length>0&&<div style={{fontSize:11,color:C.txtL,marginTop:1}}>주{m.weeklyDays.length}회 · {m.weeklyDays.join(" ")}{m.classTime?" · "+m.classTime:""}</div>}{m.expiryDate&&!exp&&days!==null&&days<=14&&<div style={{fontSize:11,color:days<=7?C.danger:C.warn,marginTop:1,fontWeight:600}}>~{fmtS(m.expiryDate)} ({days}일)</div>}</div>
              <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}><div style={{textAlign:"center",padding:"4px 8px",borderRadius:10,background:rem<=2?C.dangerBg:C.priP}}><div style={{fontSize:17,fontWeight:900,color:rem<=2?C.danger:C.priD,lineHeight:1}}>{rem}</div><div style={{fontSize:9,color:C.txtL,fontWeight:600}}>잔여</div></div><svg width="10" height="10" viewBox="0 0 24 24" fill="none" style={{opacity:.3}}><path d="M9 18l6-6-6-6" stroke={C.priL} strokeWidth="3" strokeLinecap="round"/></svg></div>
            </button>
            <button className="card-act" onClick={()=>setHistM(m)} style={{padding:"6px",border:"none",borderLeft:`1px solid ${C.bdr}`,background:"transparent",display:"flex",alignItems:"center",justifyContent:"center",width:36,flexShrink:0}}><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke={C.txtL} strokeWidth="1.5"/></svg></button>
          </div>)})}
        </div>
        {paused.length>0&&<div style={{marginTop:14}}><p style={{fontSize:12,color:C.txtM,fontWeight:700,margin:"0 0 5px"}}>일시중지</p>{paused.map(m=>(<div key={m.id} style={{padding:"8px 12px",borderRadius:10,background:C.pauseBg,border:"1px solid #ddd",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}><span style={{fontSize:13,fontWeight:700,color:C.pauseTxt}}>{m.name}</span><Badge color={C.warn} bg={C.warnBg}>중지</Badge></div>))}</div>}</>}
      </div>}
      {screen==="sign"&&sel&&<div className="af" style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",maxWidth:600,margin:"0 auto",width:"100%"}}>
        <div style={{textAlign:"center",marginBottom:10}}><p style={{fontSize:18,fontWeight:800,color:C.txt,margin:"0 0 4px"}}>{sel.name} <span style={{fontWeight:400,color:C.txtL,fontSize:14}}>회원님</span></p><p style={{fontSize:13,color:C.txtM,margin:0}}>{fmt(td())} 수업 확인</p></div>
        <StampBar total={sel.totalSessions} used={sel.usedSessions} records={records} memberId={sel.id} onDeleteNS={delNSStamp}/>
        <div style={{display:"flex",gap:8,marginBottom:6}}><div style={{flex:1,background:C.priP,borderRadius:14,padding:"8px",textAlign:"center",border:`1.5px solid ${C.bdr}`}}><div style={{fontSize:10,color:C.txtL}}>잔여</div><div style={{fontSize:22,fontWeight:900,color:(sel.totalSessions-sel.usedSessions)<=2?C.danger:C.priD,lineHeight:1}}>{sel.totalSessions-sel.usedSessions}<span style={{fontSize:10}}>회</span></div></div><div style={{flex:1.3,background:C.priP,borderRadius:14,padding:"8px",textAlign:"center",border:`1.5px solid ${C.bdr}`}}><div style={{fontSize:10,color:C.txtL}}>유효기간</div><div style={{fontSize:12,fontWeight:700,color:isExp(sel.expiryDate)?C.danger:C.txt}}>{isExp(sel.expiryDate)?"만료":sel.expiryDate?fmtShort(sel.expiryDate):"미정"}</div></div></div>
        {aI.length>1&&<SubSelect instructors={instructors} mid={sel.id} members={members} value={signI} onChange={setSignI}/>}
        <div style={{margin:"6px 0"}}><SigPad onSave={hSign} onCancel={goHome}/></div>
        <div style={{textAlign:"center",marginTop:4}}><button className="btn" onClick={()=>{if(confirm(`${sel.name} 회원님을 노쇼 처리합니다`)){hNS(sel.id);setScreen("result")}}} style={{padding:"8px 20px",borderRadius:10,border:`2px solid ${C.noshow}`,background:C.noshowBg,color:C.noshow,fontSize:12,fontWeight:700}}>NO SHOW 처리</button></div>
      </div>}
      {screen==="result"&&sel&&<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:"100%",maxWidth:500}}><ResultScreen mb={sel} records={records} onDone={goHome}/></div></div>}
    </div>
    <div style={{textAlign:"center",padding:"6px 0 12px",fontSize:10,color:C.priL,fontWeight:700,letterSpacing:3}}>ODE TO PILATES</div>
    {histM&&<HistModal mb={histM} records={records} instructors={instructors} onClose={()=>setHistM(null)} onSkip={skipNS} onUndoSkip={undoSkip} onDel={delNS} onDeleteNS={delNSStamp}/>}
    {showAdmin&&<Admin members={members} records={records} instructors={instructors} onUpM={upM} onUpR={upR} onUpI={upI} onClose={()=>setShowAdmin(false)} sync={sync} onSync={manualSync} skipNS={skipNS} undoSkip={undoSkip} delNS={delNS}/>}
  </div>)
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
