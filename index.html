function StampBar({total,used,animate,records,memberId,onDeleteNS,pendingRenewal}){const sz=total>12?26:total>8?30:36;const gap=total>12?4:total>8?5:7;const rem=total-used;

            <svg width={sz*.5} height={sz*.5} viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}

  </div>)}

/* Signature */
function SigPad({onSave,onCancel}){const ref=useRef(null);const[dr,setDr]=useState(false);const[dn,setDn]=useState(false);
  const initCanvas=useCallback(()=>{const c=ref.current;if(!c)return;const x=c.getContext("2d"),r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;x.scale(2,2);x.strokeStyle=C.priD;x.lineWidth=2.5;x.lineCap="round";x.lineJoin="round"},[]);
  useEffect(()=>{initCanvas();const h=()=>{setTimeout(initCanvas,100)};window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h)},[initCanvas]);
  const gp=e=>{const r=ref.current.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};const ms=e=>{e.preventDefault();const x=ref.current.getContext("2d"),pp=gp(e);x.beginPath();x.moveTo(pp.x,pp.y);setDr(true);setDn(true)};const mm=e=>{e.preventDefault();if(!dr)return;const x=ref.current.getContext("2d"),pp=gp(e);x.lineTo(pp.x,pp.y);x.stroke()};const me=()=>setDr(false);const cl=()=>{ref.current.getContext("2d").clearRect(0,0,ref.current.width,ref.current.height);setDn(false)};
  return(<div className="sig-wrap" style={{display:"flex",flexDirection:"column",gap:10}}><div style={{border:`2px dashed ${C.priL}`,borderRadius:18,overflow:"hidden",background:C.card,position:"relative"}}><canvas ref={ref} className="sig-canvas" style={{width:"100%",height:200,touchAction:"none",cursor:"crosshair"}} onMouseDown={ms} onMouseMove={mm} onMouseUp={me} onMouseLeave={me} onTouchStart={ms} onTouchMove={mm} onTouchEnd={me}/>{!dn&&<div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",textAlign:"center",pointerEvents:"none",zIndex:2}}><div style={{color:C.priL,fontSize:16,fontWeight:600}}>서명해주세요</div><div style={{color:C.bdr,fontSize:12,marginTop:6}}>손가락으로 자유롭게 서명하시면 됩니다</div></div>}</div><div style={{display:"flex",gap:8}}><Btn style={{flex:1}} onClick={onCancel}>취소</Btn><Btn style={{flex:1}} onClick={cl}>다시</Btn><Btn primary style={{flex:2,opacity:dn?1:.4}} onClick={()=>dn&&onSave(ref.current.toDataURL("image/png"))}>서명 완료</Btn></div></div>)}

/* Clock Daily View — Large pizza chart */
function ClockView({schedule,date}){
  const sz=340;const cx=sz/2;const cy=sz/2;const outerR=sz/2-20;const innerR=sz/2-80;
  const startH=8,endH=22,total=endH-startH;
  const toRad=deg=>(deg*Math.PI)/180;
  const hAngle=h=>((h-startH)/total)*360-90;
  const arcPath=(r,a1,a2)=>{const ra1=toRad(a1),ra2=toRad(a2);const x1=cx+Math.cos(ra1)*r,y1=cy+Math.sin(ra1)*r;const x2=cx+Math.cos(ra2)*r,y2=cy+Math.sin(ra2)*r;return{x1,y1,x2,y2}};
  const hasSchedule=schedule.filter(m=>m.displayTime).length>0;
  return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"10px 0"}}>
    <div style={{fontSize:16,fontWeight:800,marginBottom:12,color:C.txt}}>{fmt(date)}</div>
    <div style={{position:"relative",width:sz+40,height:sz+40}}>
      <svg width={sz+40} height={sz+40} viewBox={`-20 -20 ${sz+40} ${sz+40}`}>
        {/* Outer ring */}
        <circle cx={cx} cy={cy} r={outerR} fill="#faf8f6" stroke={C.bdr} strokeWidth="2"/>
        <circle cx={cx} cy={cy} r={innerR} fill="white" stroke={C.bdr} strokeWidth="1"/>
        {/* Hour grid lines and labels 8~21 */}
        {Array.from({length:total}).map((_,i)=>{const h=startH+i;const a=hAngle(h);const ra=toRad(a);
          const ox=cx+Math.cos(ra)*outerR,oy=cy+Math.sin(ra)*outerR;
          const ix=cx+Math.cos(ra)*innerR,iy=cy+Math.sin(ra)*innerR;
          const lx=cx+Math.cos(ra)*(outerR+14),ly=cy+Math.sin(ra)*(outerR+14);
          const hasSess=schedule.some(m=>m.displayTime&&parseInt(m.displayTime)=== h);
          return(<g key={h}>
            <line x1={ix} y1={iy} x2={ox} y2={oy} stroke={C.bdr} strokeWidth="1" strokeDasharray={hasSess?"":"3 3"}/>
            <text x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="12" fontWeight={hasSess?"800":"500"} fill={hasSess?C.priD:C.txtL}>{h}</text>
          </g>)})}
        {/* Pizza slices for sessions */}
        {schedule.map((m,i)=>{if(!m.displayTime)return null;
          const hr=parseInt(m.displayTime.split(":")[0]);
          const a1=hAngle(hr),a2=hAngle(hr+1);
          const o1=arcPath(outerR-1,a1,a2),i1=arcPath(innerR+1,a1,a2);
          const mc=m.color||C.pri;
          const midA=toRad((a1+a2)/2);
          const labelR=(outerR+innerR)/2;
          const lx=cx+Math.cos(midA)*labelR,ly=cy+Math.sin(midA)*labelR;
          const fill=m.done?mc:m.noshow?C.noshow:mc;
          const opacity=m.done?1:m.noshow?.8:.25;
          return(<g key={m.id}>
            <path d={`M${i1.x1},${i1.y1} L${o1.x1},${o1.y1} A${outerR-1},${outerR-1} 0 0,1 ${o1.x2},${o1.y2} L${i1.x2},${i1.y2} A${innerR+1},${innerR+1} 0 0,0 ${i1.x1},${i1.y1}`} fill={fill} opacity={opacity} stroke={mc} strokeWidth="2"/>
            <text x={lx} y={ly-6} textAnchor="middle" dominantBaseline="middle" fontSize="11" fontWeight="800" fill={m.done||m.noshow?"white":mc}>{m.name}</text>
            <text x={lx} y={ly+7} textAnchor="middle" dominantBaseline="middle" fontSize="9" fontWeight="600" fill={m.done||m.noshow?"rgba(255,255,255,.8)":C.txtM}>{m.displayTime}</text>
            {m.displayRoom&&<text x={lx} y={ly+18} textAnchor="middle" fontSize="8" fontWeight="800" fill={m.done?"rgba(255,255,255,.9)":m.displayRoom==="A"?C.roomA:C.roomB}>{m.displayRoom}실</text>}
          </g>)})}
        {/* Center */}
        <circle cx={cx} cy={cy} r={innerR-1} fill="white"/>
        <text x={cx} y={cy-8} textAnchor="middle" fontSize="13" fontWeight="800" fill={C.priD}>{schedule.length}명</text>
        <text x={cx} y={cy+8} textAnchor="middle" fontSize="10" fill={C.txtL}>수업</text>
      </svg>
    </div>
    {/* Legend below */}
    {schedule.length>0&&<div style={{display:"flex",flexDirection:"column",gap:6,marginTop:8,width:"100%",maxWidth:360}}>
      {schedule.map(m=>{const mc=m.color||C.pri;return(<div key={m.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderRadius:10,background:C.card,border:`1px solid ${C.bdr}`,borderLeft:`4px solid ${mc}`}}>
        <span style={{fontSize:13,fontWeight:800,color:mc,minWidth:45}}>{m.displayTime||"--:--"}</span>
        <span style={{fontSize:13,fontWeight:700,flex:1}}>{m.name}</span>

        <span style={{fontSize:11,color:m.done?C.ok:m.noshow?C.noshow:C.txtL,fontWeight:600}}>{m.done?"완료":m.noshow?"노쇼":"예정"}</span>
      </div>)})}
    </div>}
    {schedule.filter(m=>!m.displayTime).length>0&&<div style={{marginTop:8,fontSize:12,color:C.warn,fontWeight:600,background:C.warnBg,padding:"6px 12px",borderRadius:8}}>시간 미설정: {schedule.filter(m=>!m.displayTime).map(m=>m.name).join(", ")}</div>}
  </div>)
}

                  {recs.map((r,i)=>{const inst=instructors?.find(x=>x.id===r.instructorId);const tm=fmtT(r.timestamp);
                    return(<div key={r.timestamp||i} className="ar" style={{animationDelay:`${i*.03}s`,borderRadius:10,border:`1px solid ${C.bdr}`,overflow:"hidden",background:C.card}}>

                        </div>
                      </div>

              </div>))})()}

        {tab==="sheets"&&<div className="af" style={{background:C.priP,borderRadius:14,padding:18,textAlign:"center"}}><SyncDot s={sync}/><p style={{fontSize:13,color:C.txtM,margin:"10px 0"}}>구글 스프레드시트 동기화</p><Btn primary full style={{padding:"14px 0",fontSize:15}} onClick={onSync}>동기화</Btn><div style={{marginTop:12,padding:"10px",background:C.card,borderRadius:10,border:`1px solid ${C.bdr}`,wordBreak:"break-all"}}><p style={{fontSize:10,color:C.txtL,margin:"0 0 4px",fontWeight:700}}>스프레드시트 연결 주소</p><a href={GS} target="_blank" rel="noopener noreferrer" style={{fontSize:9,color:C.inst,textDecoration:"underline"}}>{GS}</a></div></div>}
      </>}

  </div>)
}

/* Consult Modal — All-at-once Survey */
function ConsultModal({onSave,onClose}){
  const[name,setName]=useState("");const[phone,setPhone]=useState("");
  const[ans,setAns]=useState(()=>{const s={};SURVEY_Q.forEach(q=>{s[q.id]=q.multi?[]:""});s._etc={};return s});
  const[etcOpen,setEtcOpen]=useState(null);const[etcVal,setEtcVal]=useState("");
  const toggle=(qid,opt,multi)=>{if(multi){const cur=ans[qid]||[];if(opt==="없음")setAns({...ans,[qid]:cur.includes("없음")?[]:["없음"]});else setAns({...ans,[qid]:cur.includes(opt)?cur.filter(x=>x!==opt):cur.filter(x=>x!=="없음").concat(opt)})}else setAns({...ans,[qid]:ans[qid]===opt?"":opt})};
  const addEtcFn=(qid)=>{if(!etcVal.trim())return;const v="기타: "+etcVal.trim();const q=SURVEY_Q.find(x=>x.id===qid);if(q.multi){const cur=ans[qid]||[];if(!cur.includes(v))setAns({...ans,[qid]:[...cur,v],_etc:{...ans._etc,[qid]:etcVal.trim()}})}else setAns({...ans,[qid]:v,_etc:{...ans._etc,[qid]:etcVal.trim()}});setEtcVal("");setEtcOpen(null)};
  const isAnswered=(qid)=>{const v=ans[qid];return v&&(Array.isArray(v)?v.length>0:v!==""&&v!=="직접 입력")};
  const handleSave=()=>{
    if(!name.trim()){alert("이름을 입력하세요");return}
    const missing=[];SURVEY_Q.forEach((q,i)=>{if(q.id!=="memo"&&!isAnswered(q.id))missing.push(`${i+1}. ${q.title}`)});
    if(missing.length>0){const proceed=confirm(`아래 항목이 비어있습니다:\n\n${missing.join("\n")}\n\n그래도 저장하시겠습니까?`);if(!proceed)return}
    try{onSave(name.trim(),phone.trim(),(ans.memo&&ans.memo!=="직접 입력"?ans.memo:""),ans);alert("✅ 상담 설문이 저장되었습니다!")}catch(e){alert("❌ 저장에 실패했습니다. 다시 시도해주세요.")}
  };
  return(<div style={{...ovl,zIndex:160}} onClick={onClose}><div className="as" style={{...modal,maxWidth:600,maxHeight:"90vh",overflow:"auto",position:"relative"}} onClick={e=>e.stopPropagation()}>
    {/* 닫기 X 버튼 - 고정 */}
    <button onClick={onClose} style={{position:"sticky",top:0,float:"right",width:36,height:36,borderRadius:"50%",border:`1.5px solid ${C.bdr}`,background:C.card,fontSize:18,cursor:"pointer",color:C.txtL,display:"flex",alignItems:"center",justifyContent:"center",zIndex:10,boxShadow:"0 2px 8px rgba(0,0,0,.1)"}}>✕</button>
    <h3 style={{margin:"0 0 14px",fontSize:18,fontWeight:800,color:C.txt}}>상담 설문</h3>
    {/* 기본 정보 */}
    <div style={{background:C.priPP,borderRadius:12,padding:12,marginBottom:16}}>
      <p style={{fontSize:13,fontWeight:800,color:C.priD,margin:"0 0 8px"}}>기본 정보</p>
      <div style={{display:"flex",gap:6}}>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="이름 *" style={{...inp,flex:2,padding:"10px 12px",fontSize:14}} autoFocus/>
        <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="연락처" style={{...inp,flex:1,padding:"10px 12px",fontSize:14}}/>
      </div>
    </div>
    {/* 전체 설문 항목 */}
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {SURVEY_Q.map((q,qi)=>{const v=ans[q.id];const hasV=v&&(Array.isArray(v)?v.length>0:v!==""&&v!=="직접 입력");
        return(<div key={q.id} style={{padding:"8px 10px",borderRadius:10,background:hasV?"#f7f2ee":C.card,border:`1px solid ${hasV?C.pri+"30":C.bdr}`}}>
          <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:4}}>
            <span style={{fontSize:9,color:C.txtL,fontWeight:700}}>{qi+1}</span>
            <span style={{fontSize:12,fontWeight:700,color:C.priD}}>{q.title}</span>
            <span style={{fontSize:9,color:C.txtL}}>{q.id==="memo"?"자유 입력":q.multi?"복수":"1개"}</span>
          </div>
          {q.id==="memo"?<textarea value={typeof v==="string"&&v!=="직접 입력"?v:""} onChange={e=>setAns({...ans,memo:e.target.value})} placeholder="상담 내용을 자유롭게 입력하세요" style={{...inp,minHeight:60,resize:"vertical",padding:"6px 8px",fontSize:12}}/>:
          <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
            {q.options.map(opt=>{const sel=q.multi?(v||[]).includes(opt):v===opt;
              return(<button key={opt} className="btn" onClick={()=>toggle(q.id,opt,q.multi)} style={{padding:"4px 9px",borderRadius:7,fontSize:11,fontWeight:sel?700:400,border:sel?"none":`1px solid ${C.bdr}`,background:sel?C.pri:C.card,color:sel?"white":C.txtM}}>{opt}</button>)})}
            {etcOpen===q.id?<div style={{display:"flex",gap:3,width:"100%",marginTop:2}}><input value={etcVal} onChange={e=>setEtcVal(e.target.value)} placeholder="직접 입력" style={{...inp,flex:1,padding:"4px 8px",fontSize:11}} autoFocus onKeyDown={e=>e.key==="Enter"&&addEtcFn(q.id)}/><Btn small primary onClick={()=>addEtcFn(q.id)} style={{padding:"4px 8px",fontSize:10}}>추가</Btn><Btn small onClick={()=>{setEtcOpen(null);setEtcVal("")}} style={{padding:"4px 6px",fontSize:10}}>취소</Btn></div>:
            <button className="btn" onClick={()=>setEtcOpen(q.id)} style={{padding:"4px 8px",borderRadius:7,fontSize:10,border:`1px dashed ${C.bdr}`,background:"transparent",color:C.txtL}}>+ 기타</button>}
          </div>}
        </div>)})}
    </div>
    {/* 저장 / 취소 */}
    <div style={{display:"flex",gap:8,marginTop:20,position:"sticky",bottom:0,background:C.card,padding:"12px 0",borderTop:`1px solid ${C.bdr}`}}>
      <Btn style={{flex:1}} onClick={onClose}>취소</Btn>
      <Btn primary style={{flex:2,padding:"14px 0",fontSize:15}} onClick={handleSave}>상담 설문 저장</Btn>
    </div>
  </div></div>)}

/* ═══ APP ═══ */
function App(){
  const[auth,setAuth]=useState(()=>sessionStorage.getItem("ode-auth")==="1");
  const[dark,setDark]=useState(()=>localStorage.getItem("ode-dark")==="1");
  C=dark?CD:CL;
  const toggleDark=()=>{const nd=!dark;setDark(nd);localStorage.setItem("ode-dark",nd?"1":"0")};
  const[members,setMembers]=useState([]);const[records,setRecords]=useState([]);const[instructors,setInstructors]=useState([]);
  const[sel,setSel]=useState(null);const[screen,setScreen]=useState("select");const[adminOpen,setAdminOpen]=useState(false);
  const[loading,setLoading]=useState(true);const[loadMsg]=useState("구글 스프레드시트 동기화 중...");
  const[search,setSearch]=useState("");const[sortBy,setSortBy]=useState("expiry");const[filterI,setFilterI]=useState("all");
  const[sync,setSync]=useState("idle");const[histM,setHistM]=useState(null);const[signI,setSignI]=useState(null);const[surveyMb,setSurveyMb]=useState(null);
  const[calOpen,setCalOpen]=useState(false);const[consultOpen,setConsultOpen]=useState(false);

  const save=useCallback((m,r,i)=>{LS.set("ode-m",m);LS.set("ode-r",r);LS.set("ode-i",i);setTimeout(()=>pushG(GS,m,r,i),50)},[]);

  /* ── 연장 자동 적용 ── */
  const applyRenewals=useCallback((mList)=>{
    let changed=false;
    const updated=mList.map(m=>{
      if(!m.pendingRenewal)return m;
      const rem=m.totalSessions-m.usedSessions;
      if(rem<=0){
        changed=true;
        const pr=m.pendingRenewal;
        const newFirst=pr.startDate||td();
        const newExp=cExp(newFirst,pr.sessions,pr.weeklyDays||m.weeklyDays);
        return{...m,totalSessions:pr.sessions,usedSessions:0,weeklyDays:pr.weeklyDays||m.weeklyDays,firstClassDate:newFirst,expiryDate:newExp,pendingRenewal:null,pausedDays:0};
      }
      return m;
    });
    return{members:updated,changed};
  },[]);

  const upM=useCallback(nm=>{const{members:final,changed}=applyRenewals(nm);setMembers(final);save(final,records,instructors)},[records,instructors,save,applyRenewals]);
  const saveSurvey=(mid,data)=>{const nm=members.map(m=>m.id===mid?{...m,survey:data}:m);setMembers(nm);save(nm,records,instructors)};
  const upR=useCallback(nr=>{setRecords(nr);save(members,nr,instructors)},[members,instructors,save]);
  const upI=useCallback(ni=>{setInstructors(ni);save(members,records,ni)},[members,records,save]);

  const fullSync=useCallback(async(lm,lr,li)=>{setSync("syncing");const g=await pullG(GS);if(g?.success){const gm=g.members||[],gr=g.records||[],gi=g.instructors||[];const gIds=new Set(gm.map(x=>x.id));const fm=[...gm,...lm.filter(x=>!gIds.has(x.id))];const gTs=new Set(gr.map(x=>x.timestamp));const fr=[...gr,...lr.filter(x=>x.timestamp&&!gTs.has(x.timestamp))];const gI=new Set(gi.map(x=>x.id));const fi=[...gi,...li.filter(x=>!gI.has(x.id))];
    /* 동기화 후 연장 자동 적용 */
    let changed=false;const finalM=fm.map(m=>{if(!m.pendingRenewal)return m;const rem=m.totalSessions-m.usedSessions;if(rem<=0){changed=true;const pr=m.pendingRenewal;const newFirst=pr.startDate||td();const newExp=cExp(newFirst,pr.sessions,pr.weeklyDays||m.weeklyDays);return{...m,totalSessions:pr.sessions,usedSessions:0,weeklyDays:pr.weeklyDays||m.weeklyDays,firstClassDate:newFirst,expiryDate:newExp,pendingRenewal:null,pausedDays:0}}return m});
    setMembers(finalM);setRecords(fr);setInstructors(fi);LS.set("ode-m",finalM);LS.set("ode-r",fr);LS.set("ode-i",fi);await pushG(GS,finalM,fr,fi);setSync("success");setTimeout(()=>setSync("idle"),3000);return{m:finalM,r:fr,i:fi}}setSync("error");setTimeout(()=>setSync("idle"),3000);return{m:lm,r:lr,i:li}},[]);

  useEffect(()=>{if(!auth){setLoading(false);return}setLoading(true);const lm=LS.get("ode-m")||[],lr=LS.get("ode-r")||[],li=LS.get("ode-i")||[];
    /* 로드 시 연장 자동 적용 */
    let initM=lm;initM=initM.map(m=>{if(!m.pendingRenewal)return m;const rem=m.totalSessions-m.usedSessions;if(rem<=0){const pr=m.pendingRenewal;const newFirst=pr.startDate||td();const newExp=cExp(newFirst,pr.sessions,pr.weeklyDays||m.weeklyDays);return{...m,totalSessions:pr.sessions,usedSessions:0,weeklyDays:pr.weeklyDays||m.weeklyDays,firstClassDate:newFirst,expiryDate:newExp,pendingRenewal:null,pausedDays:0}}return m});
    setMembers(initM);setRecords(lr);setInstructors(li);LS.set("ode-m",initM);fullSync(initM,lr,li).then(()=>setLoading(false)).catch(()=>setLoading(false))},[auth]);
  const manualSync=useCallback(()=>{fullSync(members,records,instructors)},[members,records,instructors,fullSync]);

  const skipNS=r=>{const nr=records.map(x=>x.timestamp===r.timestamp?{...x,type:"skipped"}:x);const nm=members.map(m=>m.id===r.memberId?{...m,usedSessions:Math.max(0,m.usedSessions-1)}:m);setRecords(nr);setMembers(nm);save(nm,nr,instructors);setHistM(p=>p?nm.find(m=>m.id===p.id)||p:p)};
  const undoSkip=r=>{if(!confirm("스킵 취소 → 노쇼 복원"))return;const nr=records.map(x=>x.timestamp===r.timestamp?{...x,type:"noshow"}:x);const nm=members.map(m=>m.id===r.memberId?{...m,usedSessions:m.usedSessions+1}:m);setRecords(nr);setMembers(nm);save(nm,nr,instructors);setHistM(p=>p?nm.find(m=>m.id===p.id)||p:p)};
  const delNS=r=>{if(!confirm("삭제 + 횟수 복원"))return;const nr=records.filter(x=>x.timestamp!==r.timestamp);const nm=members.map(m=>m.id===r.memberId?{...m,usedSessions:Math.max(0,m.usedSessions-1)}:m);setRecords(nr);setMembers(nm);save(nm,nr,instructors);setHistM(p=>p?nm.find(m=>m.id===p.id)||p:p)};
  const delNSStamp=r=>{const nr=records.filter(x=>x.timestamp!==r.timestamp);const nm=members.map(m=>m.id===r.memberId?{...m,usedSessions:Math.max(0,m.usedSessions-1)}:m);setRecords(nr);setMembers(nm);save(nm,nr,instructors);setSel(p=>p?nm.find(m=>m.id===p.id)||p:p);setHistM(p=>p?nm.find(m=>m.id===p.id)||p:p)};
  const delRecord=r=>{if(!confirm(`${fmt(r.date)} ${r.type==="attended"?"출석":r.type==="noshow"?"노쇼":"스킵"} 기록을 삭제합니다.\n사용횟수도 1회 복구됩니다.`))return;const isUsed=r.type==="attended"||r.type==="noshow";const nr=records.filter(x=>x.timestamp!==r.timestamp);const nm=isUsed?members.map(m=>m.id===r.memberId?{...m,usedSessions:Math.max(0,m.usedSessions-1)}:m):members;setRecords(nr);setMembers(nm);save(nm,nr,instructors)};
  const hNS=mid=>{const m=members.find(x=>x.id===mid);if(!m)return;const isF=m.usedSessions===0&&!m.firstClassDate;let um;if(isF){const exp=cExp(td(),m.totalSessions,m.weeklyDays);um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1,firstClassDate:td(),expiryDate:exp}:x)}else um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1}:x);
    /* 연장 자동 적용 */
    const{members:finalM}=applyRenewals(um);
    const nr=[...records,{memberId:m.id,memberName:m.name,date:td(),type:"noshow",signature:null,instructorId:m.instructorId,isSubstitute:false,timestamp:new Date().toISOString()}];setMembers(finalM);setRecords(nr);save(finalM,nr,instructors);setSel(finalM.find(x=>x.id===m.id))};
  const hSign=sig=>{const m=members.find(x=>x.id===sel.id);if(!m)return;const isF=m.usedSessions===0&&!m.firstClassDate;let um;if(isF){const exp=cExp(td(),m.totalSessions,m.weeklyDays);um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1,firstClassDate:td(),expiryDate:exp}:x)}else um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1}:x);
    /* 연장 자동 적용 */
    const{members:finalM}=applyRenewals(um);
    const aId=signI||m.instructorId;const sub=aId&&aId!==m.instructorId;const nr=[...records,{memberId:m.id,memberName:m.name,date:td(),type:"attended",signature:sig,instructorId:aId||null,isSubstitute:sub,timestamp:new Date().toISOString()}];setMembers(finalM);setRecords(nr);save(finalM,nr,instructors);setSel(finalM.find(x=>x.id===m.id));setScreen("result");setSignI(null)};
  const goHome=()=>{setScreen("select");setSel(null);setSearch("");setSignI(null);setCalOpen(false);setAdminOpen(false);setConsultOpen(false)};
  const logout=()=>{sessionStorage.removeItem("ode-auth");setAuth(false)};
  const addConsult=(name,phone,memo,surveyData)=>{const id=Date.now().toString();const nm={id,name,phone,totalSessions:0,usedSessions:0,weeklyDays:[],firstClassDate:null,expiryDate:null,status:"consult",pauseReason:null,pauseStartDate:null,pausedDays:0,instructorId:null,color:MCOL[Math.floor(Math.random()*MCOL.length)],classTime:null,room:"",scheduleOverrides:[],renewals:[],createdAt:td(),profile:{consultMemo:memo},payments:[],survey:surveyData?{...surveyData,_date:td()}:null};upM([...members,nm]);setConsultOpen(false)};

  if(!auth)return<LoginScreen onLogin={()=>setAuth(true)}/>;
  if(loading)return<LoadingGate msg={loadMsg}/>;

  const active=members.filter(m=>m.status==="active"),paused=members.filter(m=>m.status==="paused"),inactive=members.filter(m=>m.status==="inactive"),consult=members.filter(m=>m.status==="consult");
  const aI=instructors.filter(x=>x.status==="active");
  const sorted=[...active].sort((a,b)=>{if(sortBy==="expiry"){if(!a.expiryDate&&!b.expiryDate)return 0;if(!a.expiryDate)return 1;if(!b.expiryDate)return-1;return new Date(a.expiryDate)-new Date(b.expiryDate)}if(sortBy==="name")return a.name.localeCompare(b.name,"ko");if(sortBy==="remaining")return(a.totalSessions-a.usedSessions)-(b.totalSessions-b.usedSessions);return 0});
  const filtered=sorted.filter(m=>m.name.includes(search)).filter(m=>filterI==="all"||m.instructorId===filterI);

  return(<div className={`app-wrap${dark?" dark-mode":""}`} style={{minHeight:"100vh",background:C.bg}}>
    <div style={{padding:"10px 14px",borderBottom:`1px solid ${C.bdr}`,background:dark?"rgba(255,255,255,.95)":"rgba(255,255,255,.75)",backdropFilter:"blur(10px)",display:"flex",justifyContent:"space-between",alignItems:"center",gap:4,position:"sticky",top:0,zIndex:50}}>
      <div style={{display:"flex",alignItems:"center",gap:6}}>{(screen!=="select"||calOpen||adminOpen)&&<Btn small onClick={goHome} style={{padding:"5px 8px",flexShrink:0}}>←</Btn>}<span style={{fontSize:13,fontWeight:900,color:C.priD,letterSpacing:2}}>ODE TO PILATES</span></div>
      <div style={{display:"flex",gap:4,alignItems:"center",flexShrink:0}}>
        <SyncDot s={sync}/>
        {screen==="select"&&!calOpen&&!adminOpen&&<button className="btn" onClick={()=>setCalOpen(true)} style={{width:32,height:32,borderRadius:9,border:`1.5px solid ${C.bdr}`,background:C.card,color:C.inst,display:"flex",alignItems:"center",justifyContent:"center"}}><IcoCal sz={16}/></button>}
        {!adminOpen&&<Btn small onClick={()=>{setAdminOpen(true);setCalOpen(false);setScreen("select")}} style={{padding:"5px 12px",fontSize:11}}>관리</Btn>}
        <div style={{width:1,height:20,background:C.bdr,margin:"0 2px"}}/>
        <button className="btn" onClick={toggleDark} style={{width:28,height:28,borderRadius:8,border:`1px solid ${C.bdr}`,background:C.card,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:C.txtM}}>{dark?<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="2"/><path d="M12 3a9 9 0 010 18" fill="currentColor"/></svg>:<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="2"/><path d="M12 3a9 9 0 000 18" fill="currentColor"/></svg>}</button>
        <Btn small onClick={logout} style={{padding:"5px 8px",fontSize:10,color:C.txtL}}>로그아웃</Btn>
      </div>
    </div>
    <div style={{padding:"14px 12px",minHeight:"calc(100vh - 56px)",display:"flex",flexDirection:"column"}}>
      {calOpen&&screen==="select"&&!adminOpen&&<Calendar members={members} records={records} instructors={instructors} onUpM={upM}/>}
      {adminOpen&&<Admin members={members} records={records} instructors={instructors} onUpM={upM} onUpR={upR} onUpI={upI} sync={sync} onSync={manualSync} skipNS={skipNS} undoSkip={undoSkip} delNS={delNS} delRecord={delRecord}/>}
      {screen==="select"&&!calOpen&&!adminOpen&&<div className="af" style={{flex:1}}>
        <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:6}}>
          <span style={{fontFamily:"'Dancing Script',cursive",fontSize:22,fontWeight:700,color:C.priD,letterSpacing:1}}>Signature</span>
          <span style={{fontSize:13,fontWeight:700,color:C.txtL}}>서명 관리</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
          <input placeholder="검색" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,padding:"6px 8px",fontSize:12,width:80,flex:"none"}}/>
          <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{padding:"6px 8px",borderRadius:8,border:`1px solid ${C.bdr}`,fontSize:10,background:C.card,color:C.txt}}><option value="expiry">만료임박</option><option value="name">가나다</option><option value="remaining">잔여적은</option></select>
          {aI.length>0&&aI.map(x=>(<Btn key={x.id} small onClick={()=>setFilterI(filterI===x.id?"all":x.id)} style={{padding:"4px 8px",fontSize:9,background:filterI===x.id?C.inst:C.card,color:filterI===x.id?"white":C.txtL,borderColor:filterI===x.id?C.inst:C.bdr}}>{x.name}</Btn>))}
          <div style={{flex:1}}/>
          <Btn small onClick={()=>setConsultOpen(true)} style={{padding:"6px 10px",fontSize:10,background:C.instBg,color:C.inst,borderColor:C.inst}}>+ 상담</Btn>
        </div>
        {!members.filter(m=>m.status==="active").length?<p style={{color:C.txtM,fontSize:13,textAlign:"center",padding:20}}>등록된 회원이 없습니다</p>:
        <><div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:5}}>
          {filtered.map((m,i)=>{const rem=m.totalSessions-m.usedSessions;const exp=isExp(m.expiryDate);const hasPR=!!m.pendingRenewal;const off=(rem<=0||exp)&&!hasPR;const days=dLeft(m.expiryDate);const inst=instructors.find(x=>x.id===m.instructorId);
          return(<div key={m.id} className="ar card-act" style={{animationDelay:`${i*.02}s`,aspectRatio:"1",borderRadius:10,border:`1px solid ${off?"#f0c4bf":C.bdr}`,overflow:"hidden",background:off?"#FDF5F3":C.card,opacity:off?.35:1,borderTop:`3px solid ${m.color||C.pri}`,display:"flex",flexDirection:"column",padding:"6px 5px",position:"relative"}} onClick={()=>{if(off)return;setSel(m);setSignI(m.instructorId||null);setScreen("sign")}}>
            <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",fontFamily:"'Dancing Script',cursive",fontSize:22,color:m.color||C.pri,opacity:.12,fontWeight:700,letterSpacing:2,pointerEvents:"none",whiteSpace:"nowrap"}}>Signature</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{fontWeight:800,fontSize:22,color:C.txt,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{m.name}</div>
              <div style={{padding:"0 4px",borderRadius:4,background:rem<=2?C.dangerBg:C.priP,flexShrink:0}}><span style={{fontSize:22,fontWeight:900,color:rem<=2?C.danger:C.priD}}>{rem}</span></div>
            </div>
            <div style={{fontSize:16,color:C.txtM,fontWeight:600}}>{rem}/{m.totalSessions}회</div>
            {m.weeklyDays?.length>0&&<div style={{fontSize:14,color:C.priD,fontWeight:700,marginTop:1}}>{m.weeklyDays.join("·")}{m.classTime?" "+m.classTime:""}</div>}
            <div style={{flex:1}}/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
              <div>{inst&&<span style={{fontSize:12,color:C.inst,fontWeight:600}}>{inst.name}</span>}</div>
              <div style={{display:"flex",gap:2}}>
                <button className="btn" onClick={e=>{e.stopPropagation();setSurveyMb(m)}} style={{width:22,height:22,borderRadius:4,border:`1px solid ${C.bdr}`,background:C.card,display:"flex",alignItems:"center",justifyContent:"center",position:"relative"}}><IcoSurvey sz={11}/>{m.survey&&<span style={{position:"absolute",top:-1,right:-1,width:5,height:5,borderRadius:"50%",background:C.ok}}/>}</button>
                <button className="btn" onClick={e=>{e.stopPropagation();setHistM(m)}} style={{width:22,height:22,borderRadius:4,border:`1px solid ${C.bdr}`,background:C.card,display:"flex",alignItems:"center",justifyContent:"center"}}><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2" stroke={C.txtL} strokeWidth="1.5"/></svg></button>
              </div>
            </div>
            {m.expiryDate&&!exp&&days!==null&&days<=14&&<div style={{fontSize:12,color:days<=7?C.danger:C.warn,fontWeight:700,marginTop:1}}>D-{days}</div>}
          </div>)})}
        </div>
        {paused.length>0&&<div style={{marginTop:14}}><p style={{fontSize:12,color:C.txtM,fontWeight:700,margin:"0 0 5px"}}>홀드</p><div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:5}}>{paused.map(m=>(<div key={m.id} style={{padding:"6px 5px",borderRadius:8,background:C.pauseBg,border:"1px solid #ddd",textAlign:"center"}}><span style={{fontSize:11,fontWeight:700,color:C.pauseTxt}}>{m.name}</span><div><Badge color={C.warn} bg={C.warnBg}>홀드</Badge></div></div>))}</div></div>}</>}
      </div>}
      {screen==="sign"&&sel&&<div className="af" style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",maxWidth:600,margin:"0 auto",width:"100%"}}>
        <div style={{textAlign:"center",marginBottom:10}}><p style={{fontSize:18,fontWeight:800,color:C.txt,margin:"0 0 4px"}}>{sel.name} <span style={{fontWeight:400,color:C.txtL,fontSize:14}}>회원님</span></p><p style={{fontSize:13,color:C.txtM,margin:0}}>{fmt(td())} 수업 확인</p></div>
        <StampBar total={sel.totalSessions} used={sel.usedSessions} records={records} memberId={sel.id} onDeleteNS={delNSStamp} pendingRenewal={sel.pendingRenewal}/>
        <div style={{display:"flex",gap:8,marginBottom:6}}><div style={{flex:1,background:C.priP,borderRadius:14,padding:"8px",textAlign:"center",border:`1.5px solid ${C.bdr}`}}><div style={{fontSize:10,color:C.txtL}}>잔여</div><div style={{fontSize:22,fontWeight:900,color:(sel.totalSessions-sel.usedSessions)<=2?C.danger:C.priD,lineHeight:1}}>{sel.totalSessions-sel.usedSessions}<span style={{fontSize:10}}>회</span></div></div><div style={{flex:1.3,background:C.priP,borderRadius:14,padding:"8px",textAlign:"center",border:`1.5px solid ${C.bdr}`}}><div style={{fontSize:10,color:C.txtL}}>유효기간</div><div style={{fontSize:12,fontWeight:700,color:isExp(sel.expiryDate)?C.danger:C.txt}}>{isExp(sel.expiryDate)?"만료":sel.expiryDate?fmtShort(sel.expiryDate):"미정"}</div></div></div>
        {aI.length>1&&<SubSelect instructors={instructors} mid={sel.id} members={members} value={signI} onChange={setSignI}/>}
        <div style={{margin:"6px 0"}}><SigPad onSave={hSign} onCancel={goHome}/></div>
        <div style={{textAlign:"center",marginTop:4}}><button className="btn" onClick={()=>{if(confirm(`${sel.name} 회원님을 노쇼 처리합니다`)){hNS(sel.id);setScreen("result")}}} style={{padding:"8px 20px",borderRadius:10,border:`2px solid ${C.noshow}`,background:C.noshowBg,color:C.noshow,fontSize:12,fontWeight:700}}>NO SHOW 처리</button></div>
      </div>}
      {screen==="result"&&sel&&<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:"100%",maxWidth:500}}><ResultScreen mb={sel} records={records} onDone={goHome}/></div></div>}
    </div>
    <div style={{textAlign:"center",padding:"6px 0 12px",fontSize:10,color:C.priL,fontWeight:700,letterSpacing:3}}>ODE TO PILATES <span style={{letterSpacing:0,fontSize:9,opacity:.6}}>v1.6</span></div>
    {histM&&<HistModal mb={histM} records={records} instructors={instructors} onClose={()=>setHistM(null)} onSkip={skipNS} onUndoSkip={undoSkip} onDel={delNS} onDeleteNS={delNSStamp}/>}
    {surveyMb&&<SurveyModal mb={surveyMb} readOnly={!!surveyMb.survey} onSave={data=>{saveSurvey(surveyMb.id,data);setSurveyMb(null)}} onClose={()=>setSurveyMb(null)}/>}
    {consultOpen&&<ConsultModal onSave={addConsult} onClose={()=>setConsultOpen(false)}/>}
  </div>)
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
