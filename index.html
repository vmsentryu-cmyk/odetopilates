<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

const PIN="1234";
const DAYS_KR=["일","월","화","수","목","금","토"];
const WEEK_DAYS=["월","화","수","목","금","토","일"];

const fmt=(s)=>{if(!s)return"-";const d=new Date(s);return`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} (${DAYS_KR[d.getDay()]})`};
const fmtS=(s)=>{if(!s)return"-";const d=new Date(s);return`${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")} (${DAYS_KR[d.getDay()]})`};
const fmtT=(s)=>{if(!s)return"";const d=new Date(s);return`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
const td=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const isExp=(dt)=>dt&&new Date(dt)<new Date(td());
const dLeft=(dt)=>{if(!dt)return null;return Math.ceil((new Date(dt)-new Date(td()))/86400000)};
const vW=(t,f)=>{if(t===8&&f===1)return 10;if(t===16&&f===1)return 19;if(t===8&&f===2)return 6;if(t===16&&f===2)return 11;if(t===8&&f>=3)return 4;if(t===16&&f>=3)return 7;return Math.ceil(t/Math.max(f,1))+3};
const cExp=(first,tot,wD,pD=0)=>{if(!first)return null;const f=wD?.length||1;const w=vW(tot,f);const d=new Date(first);d.setDate(d.getDate()+w*7+(pD||0));return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};

/* ═══ Mocha Mousse Palette ═══ */
const C={
  pri:"#A47764",priD:"#7D5A4A",priL:"#C49A87",priP:"#F5EDE8",priPP:"#FAF6F3",
  bg:"linear-gradient(180deg,#FAF6F3 0%,#F0E6DE 50%,#E8DDD4 100%)",
  card:"#FFFFFF",cardH:"#FFFBF8",bdr:"#E0CBBD",
  txt:"#3D2B22",txtM:"#6B5548",txtL:"#9C8578",
  danger:"#C0392B",dangerBg:"#FDEDEB",warn:"#D4880F",warnBg:"#FEF6E7",
  pauseBg:"#F0ECE8",pauseTxt:"#9C8578",
  noshow:"#C0392B",noshowBg:"#FDEDEB",
  inst:"#5B7B6D",instBg:"#EDF4F0",
  ok:"#27ae60",okBg:"#eafaf1",
};

/* ═══ Storage ═══ */
const LS={get:(k)=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ═══ Google Sync ═══ */
let _st=null,_busy=false,_ready=false;
async function push(url,m,r,i){
  if(!url||_busy)return false;
  // 🛡️ 빈 데이터 push 절대 차단 — 다른 기기 데이터 날림 방지
  if(!m.length&&!i.length)return false;
  // 🛡️ pull 완료 전에는 push 안 함
  if(!_ready)return false;
  _busy=true;
  try{await fetch(url,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain"},body:JSON.stringify({members:m,records:r.map(x=>({...x,signature:null})),instructors:i,timestamp:new Date().toISOString()})});_busy=false;return true}
  catch(e){_busy=false;return false}
}
function debouncedPush(url,getS,setSync){
  if(_st)clearTimeout(_st);
  _st=setTimeout(()=>{const{m,r,i}=getS();if(!m.length&&!i.length)return;if(!_ready)return;setSync("syncing");push(url,m,r,i).then(ok=>{setSync(ok?"success":"error");setTimeout(()=>setSync("idle"),3000)})},800);
}
async function pull(url){if(!url)return null;try{const r=await fetch(url+"?t="+Date.now());if(!r.ok)return null;return await r.json()}catch{return null}}

/* ═══ Shared Styles ═══ */
const btnP={padding:"14px 0",borderRadius:14,fontSize:16,cursor:"pointer",fontWeight:600,border:"none",background:C.pri,color:"white",transition:"all .15s"};
const btnO={padding:"14px 0",borderRadius:14,fontSize:16,cursor:"pointer",fontWeight:500,border:`1.5px solid ${C.bdr}`,background:"white",color:C.txtM,transition:"all .15s"};
const ovl={position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(50,30,20,.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16};
const modal={background:"white",borderRadius:24,padding:28,boxShadow:"0 20px 60px rgba(125,90,74,.15)",width:"100%"};
const inp={padding:"12px 14px",borderRadius:10,border:`1.5px solid ${C.bdr}`,fontSize:15,outline:"none",background:"white",color:C.txt};

function SyncBadge({s}){const c={idle:C.txtL,syncing:C.warn,success:C.ok,error:C.danger};const l={idle:"대기",syncing:"동기화중...",success:"연결완료",error:"연결실패"};return<span style={{fontSize:13,color:c[s],fontWeight:700,padding:"4px 12px",borderRadius:8,background:s==="success"?C.okBg:s==="error"?C.dangerBg:s==="syncing"?C.warnBg:C.priP}}>{l[s]}</span>}
function IBadge({i}){if(!i)return null;const o=i.role==="원장";return<span style={{fontSize:12,padding:"2px 8px",borderRadius:6,fontWeight:600,color:o?"#7D5A4A":"#5B7B6D",background:o?"#F5EDE8":"#EDF4F0"}}>{o?"👑 ":""}{i.name}</span>}

/* ═══ Signature Pad ═══ */
function SigPad({onSave,onCancel}){
  const ref=useRef(null);const[dr,setDr]=useState(false);const[dn,setDn]=useState(false);
  useEffect(()=>{const c=ref.current,x=c.getContext("2d"),r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;x.scale(2,2);x.strokeStyle=C.priD;x.lineWidth=2.5;x.lineCap="round";x.lineJoin="round"},[]);
  const p=(e)=>{const r=ref.current.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}};
  const s=(e)=>{e.preventDefault();const x=ref.current.getContext("2d"),pp=p(e);x.beginPath();x.moveTo(pp.x,pp.y);setDr(true);setDn(true)};
  const m=(e)=>{e.preventDefault();if(!dr)return;const x=ref.current.getContext("2d"),pp=p(e);x.lineTo(pp.x,pp.y);x.stroke()};
  const en=()=>setDr(false);
  const cl=()=>{ref.current.getContext("2d").clearRect(0,0,ref.current.width,ref.current.height);setDn(false)};
  return(<div style={{display:"flex",flexDirection:"column",gap:14}}>
    <p style={{color:C.txtL,fontSize:15,margin:0,textAlign:"center"}}>아래에 서명해주세요</p>
    <div style={{border:`2px dashed ${C.priL}`,borderRadius:18,overflow:"hidden",background:"white",position:"relative"}}>
      <canvas ref={ref} style={{width:"100%",height:180,touchAction:"none",cursor:"crosshair"}} onMouseDown={s} onMouseMove={m} onMouseUp={en} onMouseLeave={en} onTouchStart={s} onTouchMove={m} onTouchEnd={en}/>
      {!dn&&<div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",color:C.priL,fontSize:18,pointerEvents:"none"}}>✍️ 여기에 사인</div>}
    </div>
    <div style={{display:"flex",gap:10}}>
      <button onClick={onCancel} style={{...btnO,flex:1}}>취소</button>
      <button onClick={cl} style={{...btnO,flex:1}}>다시 쓰기</button>
      <button onClick={()=>dn&&onSave(ref.current.toDataURL("image/png"))} style={{...btnP,flex:1.5,opacity:dn?1:.4}}>서명 완료</button>
    </div>
  </div>)
}

/* ═══ Info Bar — 잔여횟수 중심 ═══ */
function InfoBar({mb,inst}){
  const rem=mb.totalSessions-mb.usedSessions;const days=dLeft(mb.expiryDate);const exp=isExp(mb.expiryDate);
  return(<div style={{display:"flex",flexDirection:"column",gap:12}}>
    {inst&&<div style={{textAlign:"center",fontSize:14,color:C.inst,fontWeight:500}}>담당 강사: <strong>{inst.name}</strong></div>}
    <div style={{display:"flex",gap:12}}>
      <div style={{flex:1,background:rem<=2?C.dangerBg:C.priP,borderRadius:18,padding:"18px 14px",textAlign:"center",border:`1.5px solid ${rem<=2?"#f0c4bf":C.bdr}`}}>
        <div style={{fontSize:13,color:C.txtL,marginBottom:8,fontWeight:500}}>잔여 횟수</div>
        <div className="info-num" style={{fontSize:44,fontWeight:900,color:rem<=2?C.danger:C.priD,lineHeight:1}}>{rem}<span style={{fontSize:16,fontWeight:500,marginLeft:2}}>회</span></div>
        <div style={{fontSize:13,color:C.txtM,marginTop:8,fontWeight:500}}>전체 {mb.totalSessions}회</div>
      </div>
      <div style={{flex:1,background:exp?C.dangerBg:days!==null&&days<=7?C.warnBg:C.priP,borderRadius:18,padding:"18px 14px",textAlign:"center",border:`1.5px solid ${exp?"#f0c4bf":C.bdr}`}}>
        <div style={{fontSize:13,color:C.txtL,marginBottom:8,fontWeight:500}}>유효기간</div>
        <div style={{fontSize:exp?18:17,fontWeight:700,color:exp?C.danger:C.txt}}>{exp?"기간 만료":mb.expiryDate?fmt(mb.expiryDate):"미정"}</div>
        {days!==null&&!exp&&<div style={{fontSize:14,color:days<=7?C.warn:C.txtM,marginTop:6,fontWeight:600}}>{days}일 남음</div>}
        {mb.weeklyDays?.length>0&&<div style={{fontSize:13,color:C.priD,marginTop:4,fontWeight:500}}>주{mb.weeklyDays.length}회 ({mb.weeklyDays.join("·")})</div>}
      </div>
    </div>
  </div>)
}

/* ═══ History ═══ */
function Hist({records,limit,instructors,showCV,onCV}){
  const sh=limit?records.slice(-limit).reverse():records.slice().reverse();
  if(!sh.length)return<div style={{textAlign:"center",padding:20,color:C.txtL,fontSize:14}}>기록 없음</div>;
  const gI=(id)=>instructors?.find(x=>x.id===id);
  return(<div style={{display:"flex",flexDirection:"column",gap:8}}>
    {sh.map((r,i)=>{const ns=r.type==="noshow";const inst=gI(r.instructorId);const sub=r.isSubstitute;
      return(<div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",borderRadius:14,background:ns?C.noshowBg:"white",border:`1.5px solid ${ns?"#f0c4bf":C.bdr}`}}>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
          <span style={{fontSize:14,color:ns?C.noshow:C.priD,fontWeight:800,minWidth:30}}>#{sh.length-i}</span>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span style={{fontSize:15,color:ns?C.noshow:C.txt,fontWeight:600}}>{fmt(r.date)}</span>
              {r.timestamp&&<span style={{fontSize:12,color:C.txtL}}>{fmtT(r.timestamp)}</span>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3}}>
              {ns&&<span style={{fontSize:12,fontWeight:800,color:C.noshow,border:`2px solid ${C.noshow}`,borderRadius:6,padding:"1px 8px",letterSpacing:1,transform:"rotate(-3deg)"}}>NO SHOW</span>}
              {inst&&<span style={{fontSize:12,color:sub?"#D4880F":C.inst,fontWeight:500}}>{sub?"🔄 ":"🧘‍♀️ "}{inst.name}</span>}
            </div>
          </div>
        </div>
        {ns&&showCV&&<button onClick={()=>onCV&&onCV(r)} style={{padding:"6px 12px",borderRadius:8,border:`1.5px solid ${C.bdr}`,background:"white",color:C.priD,fontSize:12,cursor:"pointer",fontWeight:600}}>출석전환</button>}
      </div>)})}
  </div>)
}

/* ═══ Modals ═══ */
function HistModal({mb,records,instructors,onClose}){
  const mr=records.filter(r=>r.memberId===mb.id);const ns=mr.filter(r=>r.type==="noshow").length;const rem=mb.totalSessions-mb.usedSessions;
  const inst=instructors?.find(x=>x.id===mb.instructorId);
  return(<div style={ovl}><div style={{...modal,maxWidth:580,maxHeight:"85vh",overflow:"auto",position:"relative"}}>
    <button onClick={onClose} style={{position:"absolute",top:16,right:20,background:"none",border:"none",fontSize:24,cursor:"pointer",color:C.txtL,zIndex:10}}>✕</button>
    <h3 style={{color:C.txt,margin:"0 0 6px",fontSize:20,fontWeight:800}}>{mb.name}</h3>
    <div style={{display:"flex",gap:16,marginBottom:16,fontSize:14,color:C.txtM,flexWrap:"wrap",fontWeight:500}}>
      <span>총 {mr.length}회</span><span style={{color:C.priD,fontWeight:700}}>출석 {mr.length-ns}회</span>
      {ns>0&&<span style={{color:C.noshow,fontWeight:700}}>노쇼 {ns}회</span>}
      <span style={{color:C.priD,fontWeight:700}}>잔여 {rem}회</span>
    </div>
    <InfoBar mb={mb} inst={inst}/>
    <div style={{marginTop:18}}><Hist records={mr} limit={30} instructors={instructors}/></div>
  </div></div>)
}

function ResultScreen({mb,records,instructors,onDone}){
  const mr=records.filter(r=>r.memberId===mb.id);const inst=instructors?.find(x=>x.id===mb.instructorId);const rem=mb.totalSessions-mb.usedSessions;
  return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:22,padding:"28px 0",animation:"fadeIn .5s ease"}}>
    <div style={{fontSize:48}}>✅</div>
    <h2 style={{fontWeight:800,fontSize:26,color:C.txt,margin:0}}>수업 확인 완료</h2>
    <p style={{fontSize:17,color:C.txtM,margin:0,fontWeight:500}}>{mb.name}님, 오늘도 수고하셨어요!</p>
    <div style={{background:C.priP,borderRadius:18,padding:"20px 30px",textAlign:"center"}}>
      <div style={{fontSize:14,color:C.txtL,fontWeight:500}}>잔여 횟수</div>
      <div className="result-num" style={{fontSize:48,fontWeight:900,color:rem<=2?C.danger:C.priD,lineHeight:1.2}}>{rem}<span style={{fontSize:18}}>회</span></div>
    </div>
    <InfoBar mb={mb} inst={inst}/>
    {mr.length>0&&<div style={{width:"100%"}}><p style={{fontSize:15,color:C.txtM,margin:"0 0 10px 2px",fontWeight:700}}>📋 히스토리</p><Hist records={mr} limit={8} instructors={instructors}/></div>}
    <button onClick={onDone} style={{...btnP,width:"100%",padding:"18px 0",fontSize:18}}>홈으로 돌아가기</button>
  </div>)
}

function PauseModal({mb,onOk,onNo}){const[r,setR]=useState("");return(<div style={ovl}><div style={{...modal,maxWidth:420}}><h3 style={{color:C.txt,marginTop:0,fontSize:18,fontWeight:700}}>⏸ 일시중지 — {mb.name}</h3><p style={{fontSize:14,color:C.txtM}}>기간만큼 유효기간 자동 연장</p><textarea value={r} onChange={e=>setR(e.target.value)} placeholder="사유 (부상, 여행 등)" style={{width:"100%",padding:14,borderRadius:12,border:`1.5px solid ${C.bdr}`,fontSize:15,outline:"none",resize:"vertical",minHeight:70,color:C.txt}}/><div style={{display:"flex",gap:8,marginTop:16}}><button onClick={onNo} style={{...btnO,flex:1}}>취소</button><button onClick={()=>onOk(r)} style={{...btnP,flex:1,background:C.warn}}>중지 시작</button></div></div></div>)}
function DayPick({days,onChange}){return(<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{WEEK_DAYS.map(d=>(<button key={d} onClick={()=>onChange(days.includes(d)?days.filter(x=>x!==d):[...days,d])} style={{width:40,height:40,borderRadius:10,fontSize:15,fontWeight:600,cursor:"pointer",border:days.includes(d)?"none":`1.5px solid ${C.bdr}`,background:days.includes(d)?C.pri:"white",color:days.includes(d)?"white":C.txtL}}>{d}</button>))}</div>)}

function NSModal({members,onOk,onNo}){
  const[sid,setSid]=useState("");const[q,setQ]=useState("");
  const act=members.filter(m=>m.status!=="paused");const fl=act.filter(m=>m.name.includes(q));const sel=members.find(m=>m.id===sid);
  return(<div style={ovl}><div style={{...modal,maxWidth:480,maxHeight:"80vh",overflow:"auto"}}>
    <h3 style={{color:C.noshow,margin:"0 0 14px",fontSize:20,fontWeight:800}}>🚫 노쇼 처리</h3>
    <input placeholder="🔍 이름 검색" value={q} onChange={e=>setQ(e.target.value)} style={{...inp,width:"100%",marginBottom:12}}/>
    <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:200,overflow:"auto",marginBottom:16}}>
      {fl.map(m=>{const rem=m.totalSessions-m.usedSessions;return(<button key={m.id} onClick={()=>setSid(m.id)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",borderRadius:12,textAlign:"left",cursor:"pointer",border:sid===m.id?`2px solid ${C.noshow}`:`1.5px solid ${C.bdr}`,background:sid===m.id?C.noshowBg:"white"}}><span style={{fontSize:16,fontWeight:700,color:C.txt}}>{m.name}</span><span style={{fontSize:14,color:rem<=2?C.danger:C.priD,fontWeight:700}}>잔여 {rem}회</span></button>)})}
    </div>
    {sel&&<div style={{background:C.noshowBg,borderRadius:16,padding:20,marginBottom:16,textAlign:"center",border:"2px solid #f0c4bf"}}><div style={{display:"inline-block",fontSize:28,fontWeight:900,color:C.noshow,border:`4px solid ${C.noshow}`,borderRadius:12,padding:"8px 28px",letterSpacing:3,transform:"rotate(-4deg)"}}>NO SHOW</div><p style={{fontSize:18,fontWeight:700,color:C.noshow,margin:"10px 0 2px"}}>{sel.name}</p><p style={{fontSize:14,color:C.txtM,margin:0}}>1회 차감</p></div>}
    <div style={{display:"flex",gap:8}}><button onClick={onNo} style={{...btnO,flex:1}}>취소</button><button onClick={()=>sid&&onOk(sid)} disabled={!sid} style={{...btnP,flex:1,background:sid?C.noshow:"#ccc"}}>노쇼 확정</button></div>
  </div></div>)
}

function TransferModal({members,instructors,from,onOk,onNo}){
  const[to,setTo]=useState("");const[sel,setSel]=useState([]);
  const my=members.filter(m=>m.instructorId===from.id&&m.status!=="paused");const tgt=instructors.filter(x=>x.id!==from.id&&x.status==="active");
  const tog=(id)=>setSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  return(<div style={ovl}><div style={{...modal,maxWidth:520,maxHeight:"85vh",overflow:"auto"}}>
    <h3 style={{color:C.inst,margin:"0 0 4px",fontSize:18,fontWeight:800}}>🔄 회원 양도</h3>
    <p style={{fontSize:14,color:C.txtM,margin:"0 0 16px"}}>{from.name} → 다른 강사</p>
    <div style={{marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:14,fontWeight:700,color:C.txt}}>양도할 회원</span><button onClick={()=>setSel(my.map(m=>m.id))} style={{fontSize:12,color:C.inst,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>전체</button></div>
      <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:180,overflow:"auto"}}>
        {my.map(m=>(<button key={m.id} onClick={()=>tog(m.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",borderRadius:10,border:sel.includes(m.id)?`2px solid ${C.inst}`:`1.5px solid ${C.bdr}`,background:sel.includes(m.id)?C.instBg:"white",cursor:"pointer",textAlign:"left"}}><span style={{width:22,height:22,borderRadius:6,border:`2px solid ${sel.includes(m.id)?C.inst:C.bdr}`,background:sel.includes(m.id)?C.inst:"white",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:13,fontWeight:700,flexShrink:0}}>{sel.includes(m.id)?"✓":""}</span><span style={{fontSize:15,fontWeight:600,color:C.txt}}>{m.name}</span></button>))}
      </div>
    </div>
    <div style={{marginBottom:16}}><span style={{fontSize:14,fontWeight:700,color:C.txt,display:"block",marginBottom:8}}>받을 강사</span><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{tgt.map(inst=>(<button key={inst.id} onClick={()=>setTo(inst.id)} style={{padding:"12px 20px",borderRadius:12,fontSize:14,fontWeight:600,cursor:"pointer",border:to===inst.id?`2px solid ${C.inst}`:`1.5px solid ${C.bdr}`,background:to===inst.id?C.instBg:"white",color:to===inst.id?C.inst:C.txtL}}>{inst.name}</button>))}</div></div>
    <div style={{display:"flex",gap:8}}><button onClick={onNo} style={{...btnO,flex:1}}>취소</button><button onClick={()=>sel.length&&to&&onOk(sel,to)} disabled={!sel.length||!to} style={{...btnP,flex:1,background:sel.length&&to?C.inst:"#ccc"}}>양도</button></div>
  </div></div>)
}

function SubSelect({instructors,mid,members,onChange,value}){
  const mb=members.find(m=>m.id===mid);const asgn=mb?.instructorId;const ai=instructors.filter(x=>x.status==="active");
  if(ai.length<=1)return null;
  return(<div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 0",flexWrap:"wrap"}}>
    <span style={{fontSize:14,color:C.txtM,fontWeight:600}}>수업 강사:</span>
    {ai.map(inst=>{const sub=inst.id!==asgn;const on=value===inst.id;return(<button key={inst.id} onClick={()=>onChange(inst.id)} style={{padding:"8px 16px",borderRadius:10,fontSize:13,fontWeight:600,cursor:"pointer",border:on?`2px solid ${sub?C.warn:C.inst}`:`1.5px solid ${C.bdr}`,background:on?(sub?C.warnBg:C.instBg):"white",color:on?(sub?C.warn:C.inst):C.txtL}}>{inst.name}{sub&&on&&<span style={{fontSize:11,marginLeft:4}}>(대강)</span>}</button>)})}
  </div>)
}

/* ═══ Admin ═══ */
function Admin({members,onUpM,onClose,records,onUpR,instructors,onUpI,sUrl,onSUrl,sync,onSync}){
  const[eid,setEid]=useState(null);const[showAdd,setShowAdd]=useState(false);
  const[nn,setNn]=useState("");const[np,setNp]=useState("");const[nt,setNt]=useState(8);const[nd,setNd]=useState([]);const[nf,setNf]=useState("");const[ni,setNi]=useState("");
  const[ev,setEv]=useState({});const[vr,setVr]=useState(null);const[tab,setTab]=useState("members");
  const[pm,setPm]=useState(null);const[lsu,setLsu]=useState(sUrl||"");
  const[showNS,setShowNS]=useState(false);const[tfI,setTfI]=useState(null);
  const[newIN,setNewIN]=useState("");const[newIR,setNewIR]=useState("강사");const[newIP,setNewIP]=useState("");
  const aI=instructors.filter(x=>x.status==="active");

  const addM=()=>{if(!nn.trim())return;const exp=nf?cExp(nf,nt,nd):null;onUpM([...members,{id:Date.now().toString(),name:nn.trim(),phone:np.trim(),totalSessions:nt,usedSessions:0,weeklyDays:[...nd],firstClassDate:nf||null,expiryDate:exp,status:"active",pauseReason:null,pauseStartDate:null,pausedDays:0,instructorId:ni||null,createdAt:td()}]);setNn("");setNp("");setNt(8);setNd([]);setNf("");setNi("");setShowAdd(false)};
  const startE=(m)=>{setEid(m.id);setEv({name:m.name,phone:m.phone||"",totalSessions:m.totalSessions,usedSessions:m.usedSessions,weeklyDays:[...(m.weeklyDays||[])],firstClassDate:m.firstClassDate||"",expiryDate:m.expiryDate||"",instructorId:m.instructorId||""})};
  const saveE=(id)=>{const m=members.find(x=>x.id===id);const ne=ev.firstClassDate?cExp(ev.firstClassDate,parseInt(ev.totalSessions),ev.weeklyDays,m.pausedDays||0):ev.expiryDate||null;onUpM(members.map(x=>x.id===id?{...x,name:ev.name||x.name,phone:ev.phone??x.phone,totalSessions:parseInt(ev.totalSessions)||x.totalSessions,usedSessions:parseInt(ev.usedSessions)??x.usedSessions,weeklyDays:ev.weeklyDays,firstClassDate:ev.firstClassDate||x.firstClassDate,expiryDate:ne,instructorId:ev.instructorId||null}:x));setEid(null)};
  const delM=(id)=>{if(confirm("삭제?"))onUpM(members.filter(m=>m.id!==id))};
  const pauseM=(id,reason)=>{onUpM(members.map(m=>m.id===id?{...m,status:"paused",pauseReason:reason,pauseStartDate:td()}:m));setPm(null)};
  const resumeM=(id)=>{const m=members.find(x=>x.id===id);if(!m||m.status!=="paused")return;const pd=m.pauseStartDate?Math.max(0,Math.ceil((new Date(td())-new Date(m.pauseStartDate))/86400000)):0;const tp=(m.pausedDays||0)+pd;const ne=m.firstClassDate?cExp(m.firstClassDate,m.totalSessions,m.weeklyDays,tp):m.expiryDate?(()=>{const d=new Date(m.expiryDate);d.setDate(d.getDate()+pd);return d.toISOString().slice(0,10)})():null;onUpM(members.map(x=>x.id===id?{...x,status:"active",pauseReason:null,pauseStartDate:null,pausedDays:tp,expiryDate:ne}:x))};
  const hNS=(mid)=>{const m=members.find(x=>x.id===mid);if(!m)return;const isF=m.usedSessions===0&&!m.firstClassDate;let um;if(isF){const exp=cExp(td(),m.totalSessions,m.weeklyDays);um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1,firstClassDate:td(),expiryDate:exp}:x)}else{um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1}:x)}onUpM(um);onUpR([...records,{memberId:m.id,memberName:m.name,date:td(),type:"noshow",signature:null,instructorId:m.instructorId,isSubstitute:false,timestamp:new Date().toISOString()}]);setShowNS(false)};
  const cvNS=(r)=>{if(!confirm("출석 전환?"))return;onUpR(records.map(x=>x.timestamp===r.timestamp?{...x,type:"attended",convertedAt:new Date().toISOString()}:x))};
  const addI=()=>{if(!newIN.trim())return;onUpI([...instructors,{id:Date.now().toString(),name:newIN.trim(),role:newIR,phone:newIP.trim(),status:"active",createdAt:td()}]);setNewIN("");setNewIR("강사");setNewIP("")};
  const resignI=(id)=>{if(!confirm("퇴사?"))return;onUpI(instructors.map(x=>x.id===id?{...x,status:"resigned",resignedAt:td()}:x))};
  const reactI=(id)=>onUpI(instructors.map(x=>x.id===id?{...x,status:"active",resignedAt:null}:x));
  const delI=(id)=>{if(members.some(m=>m.instructorId===id)){alert("회원 양도 먼저!");return}if(!confirm("삭제?"))return;onUpI(instructors.filter(x=>x.id!==id))};
  const hTf=(mids,toId)=>{onUpM(members.map(m=>mids.includes(m.id)?{...m,instructorId:toId}:m));setTfI(null)};
  const mRecs=vr?records.filter(r=>r.memberId===vr):[];

  return(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(50,30,20,.4)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:100,padding:"16px 10px",overflowY:"auto"}}>
    <div className="admin-box" style={{background:"white",borderRadius:24,width:"100%",maxWidth:700,maxHeight:"92vh",overflow:"auto",padding:"28px 24px",position:"relative",boxShadow:"0 20px 60px rgba(125,90,74,.15)"}}>
      <button onClick={onClose} style={{position:"absolute",top:16,right:20,background:"none",border:"none",fontSize:24,cursor:"pointer",color:C.txtL}}>✕</button>
      <h2 style={{fontWeight:800,fontSize:22,color:C.txt,margin:"0 0 18px"}}>⚙️ 관리자</h2>
      <div className="admin-tabs" style={{display:"flex",gap:6,marginBottom:18,flexWrap:"wrap"}}>
        {[["members","회원"],["instructors","강사"],["records","기록"],["sheets","Google"]].map(([t,l])=>(<button key={t} onClick={()=>{setTab(t);setVr(null)}} style={{padding:"10px 18px",borderRadius:12,border:tab===t?"none":`1.5px solid ${C.bdr}`,background:tab===t?C.pri:"white",color:tab===t?"white":C.txtM,fontSize:14,cursor:"pointer",fontWeight:600}}>{l}</button>))}
        <button onClick={()=>setShowNS(true)} className="admin-ns" style={{padding:"10px 18px",borderRadius:12,border:`2px solid ${C.noshow}`,background:"white",color:C.noshow,fontSize:14,cursor:"pointer",fontWeight:700,marginLeft:"auto"}}>🚫 노쇼</button>
      </div>

      {tab==="members"&&<>
        <button onClick={()=>setShowAdd(!showAdd)} style={{padding:"12px 24px",borderRadius:12,border:"none",background:C.priD,color:"white",fontSize:15,cursor:"pointer",fontWeight:700,marginBottom:16}}>+ 회원 추가</button>
        {showAdd&&(<div className="add-form" style={{background:C.priP,borderRadius:16,padding:20,marginBottom:16,display:"flex",flexDirection:"column",gap:14}}>
          <div style={{display:"flex",gap:8}}><input placeholder="이름 *" value={nn} onChange={e=>setNn(e.target.value)} style={{...inp,flex:1}}/><input placeholder="연락처" value={np} onChange={e=>setNp(e.target.value)} style={{...inp,flex:1}}/></div>
          <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}><span style={{fontSize:14,color:C.txtM,fontWeight:600}}>등록:</span>{[8,16].map(n=>(<button key={n} onClick={()=>setNt(n)} style={{padding:"10px 22px",borderRadius:12,fontSize:15,fontWeight:700,cursor:"pointer",border:nt===n?"none":`1.5px solid ${C.bdr}`,background:nt===n?C.pri:"white",color:nt===n?"white":C.txtL}}>{n}회</button>))}</div>
          <div><span style={{fontSize:14,color:C.txtM,fontWeight:600,display:"block",marginBottom:8}}>수업 요일</span><DayPick days={nd} onChange={setNd}/>{nd.length>0&&<p style={{fontSize:13,color:C.priD,margin:"8px 0 0",fontWeight:600}}>주{nd.length}회 → {vW(nt,nd.length)}주</p>}</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}><span style={{fontSize:14,color:C.txtM,fontWeight:600}}>첫 수업일</span><input type="date" value={nf} onChange={e=>setNf(e.target.value)} style={inp}/></div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}><span style={{fontSize:14,color:C.txtM,fontWeight:600}}>담당 강사</span><select value={ni} onChange={e=>setNi(e.target.value)} style={{...inp,minWidth:130}}><option value="">미배정</option>{aI.map(i=>(<option key={i.id} value={i.id}>{i.name}</option>))}</select></div>
          <button onClick={addM} style={{...btnP,padding:"14px"}}>추가 완료</button>
        </div>)}
        {members.length===0?<p style={{color:C.txtL,textAlign:"center",padding:40,fontSize:15}}>등록된 회원이 없습니다</p>:
        <div style={{display:"flex",flexDirection:"column",gap:10}}>{members.map(m=>{const rem=m.totalSessions-m.usedSessions;const exp=isExp(m.expiryDate);const ed=eid===m.id;const pa=m.status==="paused";const inst=instructors.find(x=>x.id===m.instructorId);
          return(<div key={m.id} style={{background:pa?C.pauseBg:exp?"#FDF5F3":C.priPP,borderRadius:16,padding:18,border:`1.5px solid ${pa?"#ddd":exp?"#f0c4bf":C.bdr}`,opacity:pa?.7:1}}>
            {ed?(<div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div style={{display:"flex",gap:8}}><input value={ev.name} onChange={e=>setEv({...ev,name:e.target.value})} style={{...inp,flex:1}} placeholder="이름"/><input value={ev.phone} onChange={e=>setEv({...ev,phone:e.target.value})} style={{...inp,flex:1}} placeholder="연락처"/></div>
              <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}><span style={{fontSize:14,color:C.txtM}}>등록:</span>{[8,16].map(n=>(<button key={n} onClick={()=>setEv({...ev,totalSessions:n})} style={{padding:"8px 18px",borderRadius:10,fontSize:14,fontWeight:600,cursor:"pointer",border:ev.totalSessions===n?"none":`1.5px solid ${C.bdr}`,background:ev.totalSessions===n?C.pri:"white",color:ev.totalSessions===n?"white":C.txtL}}>{n}회</button>))}<span style={{fontSize:14,color:C.txtM}}>사용:<input type="number" value={ev.usedSessions} onChange={e=>setEv({...ev,usedSessions:e.target.value})} style={{...inp,width:60,marginLeft:4}}/></span></div>
              <div><span style={{fontSize:14,color:C.txtM,display:"block",marginBottom:6}}>수업 요일</span><DayPick days={ev.weeklyDays} onChange={d=>setEv({...ev,weeklyDays:d})}/></div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}><span style={{fontSize:14,color:C.txtM}}>첫수업</span><input type="date" value={ev.firstClassDate} onChange={e=>setEv({...ev,firstClassDate:e.target.value})} style={inp}/></div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}><span style={{fontSize:14,color:C.txtM}}>강사</span><select value={ev.instructorId} onChange={e=>setEv({...ev,instructorId:e.target.value})} style={{...inp,minWidth:130}}><option value="">미배정</option>{aI.map(i=>(<option key={i.id} value={i.id}>{i.name}</option>))}</select></div>
              <div style={{display:"flex",gap:8}}><button onClick={()=>saveE(m.id)} style={{padding:"10px 20px",borderRadius:10,border:"none",background:C.pri,color:"white",fontSize:14,cursor:"pointer",fontWeight:600}}>저장</button><button onClick={()=>setEid(null)} style={{padding:"10px 20px",borderRadius:10,border:`1.5px solid ${C.bdr}`,background:"white",color:C.txtL,fontSize:14,cursor:"pointer"}}>취소</button></div>
            </div>):(<div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:200}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}><span style={{fontWeight:800,fontSize:17,color:pa?C.pauseTxt:C.txt}}>{m.name}</span>{pa&&<span style={{fontSize:12,background:C.warn,color:"white",padding:"3px 10px",borderRadius:8,fontWeight:600}}>중지</span>}{inst&&<IBadge i={inst}/>}</div>
                <div style={{display:"flex",gap:12,flexWrap:"wrap",fontSize:14}}>
                  <span style={{color:rem<=2?C.danger:C.priD,fontWeight:700}}>잔여 {rem}회 / {m.totalSessions}회</span>
                  {m.weeklyDays?.length>0&&<span style={{color:C.priD,fontWeight:500}}>주{m.weeklyDays.length}회</span>}
                  {m.expiryDate&&<span style={{color:exp?C.danger:C.txtM,fontWeight:500}}>{exp?"⚠ 만료":`~${fmtS(m.expiryDate)}`}</span>}
                </div>
              </div>
              <div className="edit-btns" style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {pa?<button onClick={()=>resumeM(m.id)} style={{padding:"8px 14px",borderRadius:10,border:"none",background:C.ok,color:"white",fontSize:12,cursor:"pointer",fontWeight:700}}>재개</button>:<button onClick={()=>setPm(m)} style={{padding:"8px 12px",borderRadius:10,border:`1.5px solid ${C.warn}`,background:"white",color:C.warn,fontSize:12,cursor:"pointer",fontWeight:600}}>중지</button>}
                <button onClick={()=>{setVr(m.id);setTab("records")}} style={{padding:"8px 12px",borderRadius:10,border:`1.5px solid ${C.bdr}`,background:"white",color:C.txtM,fontSize:12,cursor:"pointer"}}>기록</button>
                <button onClick={()=>startE(m)} style={{padding:"8px 12px",borderRadius:10,border:`1.5px solid ${C.bdr}`,background:"white",color:C.txtM,fontSize:12,cursor:"pointer"}}>수정</button>
                <button onClick={()=>delM(m.id)} style={{padding:"8px 12px",borderRadius:10,border:"1.5px solid #f0c4bf",background:"white",color:C.danger,fontSize:12,cursor:"pointer"}}>삭제</button>
              </div>
            </div>)}
          </div>)})}</div>}
      </>}

      {tab==="instructors"&&<div>
        <div style={{background:C.instBg,borderRadius:16,padding:20,marginBottom:18}}>
          <h4 style={{color:C.inst,margin:"0 0 10px",fontSize:16,fontWeight:700}}>👩‍🏫 강사 추가</h4>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}><input placeholder="이름*" value={newIN} onChange={e=>setNewIN(e.target.value)} style={{...inp,flex:1,minWidth:100}}/><input placeholder="연락처" value={newIP} onChange={e=>setNewIP(e.target.value)} style={{...inp,flex:1,minWidth:100}}/><select value={newIR} onChange={e=>setNewIR(e.target.value)} style={{...inp,minWidth:80}}><option value="강사">강사</option><option value="원장">원장</option></select><button onClick={addI} style={{padding:"10px 22px",borderRadius:10,border:"none",background:C.inst,color:"white",fontSize:14,cursor:"pointer",fontWeight:600}}>추가</button></div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {instructors.map(inst=>{const mc=members.filter(m=>m.instructorId===inst.id&&m.status!=="paused").length;const isR=inst.status==="resigned";
            return(<div key={inst.id} style={{background:isR?"#f5f5f5":"white",borderRadius:16,padding:20,border:`1.5px solid ${isR?"#ddd":C.bdr}`,opacity:isR?.55:1}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
                <div><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><span style={{fontSize:18,fontWeight:800,color:isR?"#999":C.txt}}>{inst.role==="원장"?"👑":"🧘‍♀️"} {inst.name}</span><span style={{fontSize:12,color:"white",background:isR?"#999":inst.role==="원장"?C.priD:C.inst,padding:"3px 10px",borderRadius:8,fontWeight:600}}>{inst.role}</span></div><div style={{fontSize:14,color:C.inst,fontWeight:600}}>회원 {mc}명</div></div>
                <div style={{display:"flex",gap:5}}>
                  {!isR&&mc>0&&<button onClick={()=>setTfI(inst)} style={{padding:"8px 14px",borderRadius:10,border:`1.5px solid ${C.inst}`,background:"white",color:C.inst,fontSize:12,cursor:"pointer",fontWeight:700}}>🔄 양도</button>}
                  {isR?<button onClick={()=>reactI(inst.id)} style={{padding:"8px 14px",borderRadius:10,border:"none",background:C.ok,color:"white",fontSize:12,cursor:"pointer",fontWeight:700}}>복직</button>:<button onClick={()=>resignI(inst.id)} style={{padding:"8px 14px",borderRadius:10,border:"1.5px solid #e74c3c",background:"white",color:"#e74c3c",fontSize:12,cursor:"pointer"}}>퇴사</button>}
                  <button onClick={()=>delI(inst.id)} style={{padding:"8px 12px",borderRadius:10,border:"1.5px solid #f0c4bf",background:"white",color:C.danger,fontSize:12,cursor:"pointer"}}>삭제</button>
                </div>
              </div>
              {mc>0&&<div style={{marginTop:10,display:"flex",gap:5,flexWrap:"wrap"}}>{members.filter(m=>m.instructorId===inst.id&&m.status!=="paused").map(m=>(<span key={m.id} style={{fontSize:13,background:C.instBg,color:C.inst,padding:"4px 12px",borderRadius:8,fontWeight:500}}>{m.name}</span>))}</div>}
            </div>)})}
        </div>
      </div>}

      {tab==="records"&&<div>
        {vr&&<div style={{marginBottom:12}}><button onClick={()=>setVr(null)} style={{padding:"6px 16px",borderRadius:10,border:`1.5px solid ${C.bdr}`,background:"white",color:C.txtM,fontSize:13,cursor:"pointer"}}>← 전체</button><span style={{marginLeft:12,fontSize:16,color:C.txt,fontWeight:700}}>{members.find(m=>m.id===vr)?.name}</span></div>}
        <Hist records={vr?mRecs:records} limit={50} instructors={instructors} showCV={true} onCV={cvNS}/>
      </div>}

      {tab==="sheets"&&<div style={{display:"flex",flexDirection:"column",gap:16}}>
        <div style={{background:C.priP,borderRadius:16,padding:22}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><h3 style={{color:C.txt,margin:0,fontSize:17,fontWeight:700}}>📊 Google 연동</h3><SyncBadge s={sync}/></div>
          <input value={lsu} onChange={e=>{setLsu(e.target.value);onSUrl(e.target.value)}} placeholder="Google Apps Script URL 붙여넣기" style={{...inp,width:"100%",marginBottom:14}}/>
          <button onClick={()=>{if(!lsu){alert("URL을 먼저 입력해주세요");return}onSUrl(lsu);onSync(lsu)}} style={{...btnP,width:"100%",padding:"16px 0",fontSize:17}}>🔄 동기화</button>
        </div>
      </div>}

      {pm&&<PauseModal mb={pm} onOk={(r)=>pauseM(pm.id,r)} onNo={()=>setPm(null)}/>}
      {showNS&&<NSModal members={members} onOk={hNS} onNo={()=>setShowNS(false)}/>}
      {tfI&&<TransferModal members={members} instructors={instructors} from={tfI} onOk={hTf} onNo={()=>setTfI(null)}/>}
    </div>
  </div>)
}

function PinInput({onOk,onNo}){const[p,setP]=useState("");const[e,setE]=useState(false);const chk=()=>{if(p===PIN)onOk();else{setE(true);setP("");setTimeout(()=>setE(false),1500)}};return(<div style={ovl}><div style={{...modal,maxWidth:360,textAlign:"center"}}><h3 style={{color:C.txt,marginTop:0,fontSize:18,fontWeight:700}}>🔒 관리자 PIN</h3><input type="password" value={p} onChange={ev=>setP(ev.target.value)} onKeyDown={ev=>ev.key==="Enter"&&chk()} placeholder="PIN" style={{padding:"16px 22px",borderRadius:14,border:e?`2px solid ${C.danger}`:`2px solid ${C.bdr}`,fontSize:28,textAlign:"center",width:160,outline:"none",fontFamily:"monospace",letterSpacing:10,color:C.txt}} autoFocus/>{e&&<p style={{color:C.danger,fontSize:13,fontWeight:600}}>PIN이 틀립니다</p>}<div style={{display:"flex",gap:8,justifyContent:"center",marginTop:16}}><button onClick={onNo} style={{...btnO,padding:"12px 24px"}}>취소</button><button onClick={chk} style={{...btnP,padding:"12px 24px"}}>확인</button></div></div></div>)}

/* ═══ MAIN ═══ */
function App(){
  const[members,setMembers]=useState([]);const[records,setRecords]=useState([]);const[instructors,setInstructors]=useState([]);
  const[sel,setSel]=useState(null);const[screen,setScreen]=useState("select");
  const[showPin,setShowPin]=useState(false);const[showAdmin,setShowAdmin]=useState(false);
  const[loading,setLoading]=useState(true);const[search,setSearch]=useState("");
  const[sortBy,setSortBy]=useState("expiry");const[filterI,setFilterI]=useState("all");
  const[sUrl,setSUrl]=useState("");const[sync,setSync]=useState("idle");
  const[histM,setHistM]=useState(null);const[signI,setSignI]=useState(null);

  const mR=useRef(members);const rR=useRef(records);const iR=useRef(instructors);
  useEffect(()=>{mR.current=members},[members]);
  useEffect(()=>{rR.current=records},[records]);
  useEffect(()=>{iR.current=instructors},[instructors]);
  const getS=()=>({m:mR.current,r:rR.current,i:iR.current});

  useEffect(()=>{
    const lm=LS.get("ode-m")||[];const lr=LS.get("ode-r")||[];const li=LS.get("ode-i")||[];
    const url=localStorage.getItem("ode-url")||"https://script.google.com/macros/s/AKfycbx2DwNc8NT4jCCX8Jh1dtfMycKVnvIe7pSfJQ4lJ0MSyGo309ayYwN734ErzRJcMudz/exec";
    setSUrl(url);
    
    if(url){
      // 🛡️ 항상 구글에서 먼저 가져온 후 로컬과 병합
      pull(url).then(d=>{
        if(d?.success){
          const gm=d.members||[];const gr=d.records||[];const gi=d.instructors||[];
          // 구글 데이터가 있으면 구글 우선, 없으면 로컬 사용
          const finalM=gm.length?gm:lm;
          // 기록은 양쪽 병합 (timestamp 기준 중복 제거)
          const tsSet=new Set();const mergedR=[];
          [...gr,...lr].forEach(r=>{if(r.timestamp&&!tsSet.has(r.timestamp)){tsSet.add(r.timestamp);mergedR.push(r)}else if(!r.timestamp)mergedR.push(r)});
          const finalI=gi.length?gi:li;
          
          setMembers(finalM);setRecords(mergedR);setInstructors(finalI);
          mR.current=finalM;rR.current=mergedR;iR.current=finalI;
          LS.set("ode-m",finalM);LS.set("ode-r",mergedR);LS.set("ode-i",finalI);
          
          // ✅ pull 완료 → push 허용
          _ready=true;
          
          // 로컬에만 있던 데이터가 있으면 구글에 올림
          if(lm.length>0&&gm.length===0){
            push(url,finalM,mergedR,finalI);
          }
        }else{
          // 구글 연결 실패 → 로컬 데이터 사용, push는 차단 유지
          setMembers(lm);setRecords(lr);setInstructors(li);
          if(lm.length>0)_ready=true; // 로컬에 데이터 있으면 push 허용
        }
        setLoading(false);
      }).catch(()=>{
        setMembers(lm);setRecords(lr);setInstructors(li);
        if(lm.length>0)_ready=true;
        setLoading(false);
      });
    }else{
      // URL 없음 → 로컬만 사용
      setMembers(lm);setRecords(lr);setInstructors(li);
      _ready=true;
      setLoading(false);
    }
  },[]);

  const doSync=()=>{if(sUrl)debouncedPush(sUrl,getS,setSync)};
  const upM=useCallback((nm)=>{setMembers(nm);mR.current=nm;LS.set("ode-m",nm);doSync()},[sUrl]);
  const upR=useCallback((nr)=>{setRecords(nr);rR.current=nr;LS.set("ode-r",nr);doSync()},[sUrl]);
  const upI=useCallback((ni)=>{setInstructors(ni);iR.current=ni;LS.set("ode-i",ni);doSync()},[sUrl]);
  const upSU=(u)=>{setSUrl(u);localStorage.setItem("ode-url",u)};
  const hSync=async(url)=>{
    const u=url||sUrl;if(!u)return;
    setSync("syncing");
    const d=await pull(u);
    if(d?.members){
      const gm=d.members||[];const gr=d.records||[];const gi=d.instructors||[];
      const tsSet=new Set();const merged=[];
      [...gr,...rR.current].forEach(r=>{if(r.timestamp&&!tsSet.has(r.timestamp)){tsSet.add(r.timestamp);merged.push(r)}else if(!r.timestamp)merged.push(r)});
      const fm=gm.length>=mR.current.length?gm:mR.current;
      const fi=gi.length>=iR.current.length?gi:iR.current;
      setMembers(fm);setRecords(merged);setInstructors(fi);
      mR.current=fm;rR.current=merged;iR.current=fi;
      LS.set("ode-m",fm);LS.set("ode-r",merged);LS.set("ode-i",fi);
      _ready=true;
      await push(u,fm,merged,fi);
      setSync("success");
    }else if(mR.current.length>0){
      _ready=true;
      const ok=await push(u,mR.current,rR.current,iR.current);
      setSync(ok?"success":"error");
    }else{setSync("error")}
    setTimeout(()=>setSync("idle"),4000);
  };

  const hSign=(sig)=>{
    const m=members.find(x=>x.id===sel.id);if(!m)return;
    const isF=m.usedSessions===0&&!m.firstClassDate;let um;
    if(isF){const exp=cExp(td(),m.totalSessions,m.weeklyDays);um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1,firstClassDate:td(),expiryDate:exp}:x)}
    else{um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1}:x)}
    const aId=signI||m.instructorId;const sub=aId&&aId!==m.instructorId;
    const nr={memberId:m.id,memberName:m.name,date:td(),type:"attended",signature:sig,instructorId:aId||null,isSubstitute:sub,timestamp:new Date().toISOString()};
    const newR=[...records,nr];setMembers(um);setRecords(newR);mR.current=um;rR.current=newR;
    LS.set("ode-m",um);LS.set("ode-r",newR);doSync();
    setSel(um.find(x=>x.id===m.id));setScreen("result");setSignI(null);
  };

  const goHome=()=>{setScreen("select");setSel(null);setSearch("");setSignI(null)};
  const active=members.filter(m=>m.status!=="paused");const paused=members.filter(m=>m.status==="paused");
  const aI=instructors.filter(x=>x.status==="active");
  const sorted=[...active].sort((a,b)=>{if(sortBy==="expiry"){if(!a.expiryDate&&!b.expiryDate)return 0;if(!a.expiryDate)return 1;if(!b.expiryDate)return-1;return new Date(a.expiryDate)-new Date(b.expiryDate)}if(sortBy==="name")return a.name.localeCompare(b.name,"ko");if(sortBy==="remaining")return(a.totalSessions-a.usedSessions)-(b.totalSessions-b.usedSessions);return 0});
  const filtered=sorted.filter(m=>m.name.includes(search)).filter(m=>filterI==="all"||m.instructorId===filterI);
  const sRecs=sel?records.filter(r=>r.memberId===sel.id):[];

  if(loading)return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg}}><div style={{textAlign:"center"}}><p style={{fontSize:32,fontWeight:900,color:C.priD,letterSpacing:5}}>ODE TO PILATES</p><p style={{color:C.txtL,fontSize:15}}>불러오는 중...</p></div></div>);

  return(
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:"'Noto Sans KR',sans-serif",maxWidth:720,margin:"0 auto"}}>
      {/* Header */}
      <div style={{padding:"24px 24px 18px",textAlign:"center",borderBottom:`1.5px solid ${C.bdr}`,background:"rgba(255,255,255,.7)",backdropFilter:"blur(10px)",position:"relative"}}>
        {screen!=="select"&&<button onClick={goHome} style={{position:"absolute",top:20,left:18,padding:"8px 18px",borderRadius:12,border:`1.5px solid ${C.bdr}`,background:"rgba(255,255,255,.9)",color:C.txtM,fontSize:15,cursor:"pointer",fontWeight:600}}>🏠</button>}
        <button onClick={()=>setShowPin(true)} style={{position:"absolute",top:20,right:18,padding:"8px 18px",borderRadius:12,border:`1.5px solid ${C.bdr}`,background:"rgba(255,255,255,.9)",color:C.txtM,fontSize:14,cursor:"pointer",fontWeight:600}}>⚙️ 관리</button>
        <div className="hdr-title" style={{fontSize:28,fontWeight:900,color:C.priD,letterSpacing:5}}>ODE TO PILATES</div>
        <p className="hdr-sub" style={{margin:"6px 0 0",fontSize:15,color:C.pri,fontWeight:600,letterSpacing:2}}>수업확인</p>
      </div>

      <div style={{padding:"22px 22px",minHeight:"calc(100vh - 110px)"}}>
        {/* SELECT */}
        {screen==="select"&&(<div style={{animation:"fadeIn .3s ease"}}>
          <p className="home-msg" style={{fontSize:19,color:C.txt,fontWeight:700,marginBottom:16,textAlign:"center"}}>이름을 선택해주세요</p>
          <div className="search-row" style={{display:"flex",gap:10,marginBottom:12}}>
            <input placeholder="🔍 이름 검색..." value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,padding:"14px 18px",borderRadius:14,border:`1.5px solid ${C.bdr}`,fontSize:16,outline:"none",background:"white",color:C.txt,minWidth:0}}/>
            <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{padding:"14px 14px",borderRadius:14,border:`1.5px solid ${C.bdr}`,fontSize:13,outline:"none",background:"white",color:C.txt,cursor:"pointer",fontWeight:500,flexShrink:0}}>
              <option value="expiry">만료임박순</option><option value="name">가나다순</option><option value="remaining">잔여적은순</option>
            </select>
          </div>
          {aI.length>0&&<div className="filter-row" style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{fontSize:13,color:C.txtM,fontWeight:600}}>강사</span>
            <button onClick={()=>setFilterI("all")} style={{padding:"7px 14px",borderRadius:10,fontSize:13,fontWeight:filterI==="all"?700:500,cursor:"pointer",border:filterI==="all"?"none":`1.5px solid ${C.bdr}`,background:filterI==="all"?C.priD:"white",color:filterI==="all"?"white":C.txtL}}>전체</button>
            {aI.map(inst=>(<button key={inst.id} onClick={()=>setFilterI(inst.id)} style={{padding:"7px 14px",borderRadius:10,fontSize:13,fontWeight:filterI===inst.id?700:500,cursor:"pointer",border:filterI===inst.id?"none":`1.5px solid ${C.bdr}`,background:filterI===inst.id?C.inst:"white",color:filterI===inst.id?"white":C.txtL}}>{inst.name}</button>))}
          </div>}

          {!members.length?<div style={{textAlign:"center",padding:50}}><p style={{fontSize:44}}>🌸</p><p style={{color:C.txtM,fontSize:16,fontWeight:500}}>등록된 회원이 없습니다</p><p style={{color:C.txtL,fontSize:14}}>⚙️ 관리 → 회원 추가</p></div>:
          <><div style={{display:"flex",flexDirection:"column",gap:10}}>
            {filtered.map((m,i)=>{const rem=m.totalSessions-m.usedSessions;const exp=isExp(m.expiryDate);const off=rem<=0||exp;const days=dLeft(m.expiryDate);const inst=instructors.find(x=>x.id===m.instructorId);const ns=records.filter(r=>r.memberId===m.id&&r.type==="noshow").length;
              return(<div key={m.id} style={{display:"flex",alignItems:"center",borderRadius:18,border:`1.5px solid ${off?"#f0c4bf":C.bdr}`,overflow:"hidden",background:off?"#FDF5F3":C.card,opacity:off?.45:1,animation:`floatIn .3s ease ${i*.03}s both`,boxShadow:off?"none":"0 3px 12px rgba(164,119,100,.08)"}}>
                <button onClick={()=>{if(rem<=0){alert("횟수 없음");return}if(exp){alert("기간 만료");return}setSel(m);setSignI(m.instructorId||null);setScreen("sign")}} className="card-btn" style={{flex:1,display:"flex",justifyContent:"space-between",alignItems:"center",padding:"18px 4px 18px 20px",border:"none",background:"transparent",cursor:off?"default":"pointer",textAlign:"left"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                      <span className="card-name" style={{fontSize:18,fontWeight:800,color:C.txt}}>{m.name}</span>
                      {inst&&<IBadge i={inst}/>}
                      {ns>0&&<span style={{fontSize:11,color:C.noshow,fontWeight:800,border:`1.5px solid ${C.noshow}`,borderRadius:5,padding:"1px 6px"}}>노쇼{ns}</span>}
                    </div>
                    {m.weeklyDays?.length>0&&<div style={{fontSize:13,color:C.txtL,marginTop:3,fontWeight:500}}>{m.weeklyDays.join("·")}</div>}
                    {m.expiryDate&&!exp&&days!==null&&days<=14&&<div style={{fontSize:13,color:days<=7?C.danger:C.warn,marginTop:2,fontWeight:600}}>~{fmtS(m.expiryDate)} ({days}일)</div>}
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                    <div style={{textAlign:"center",padding:"8px 14px",borderRadius:12,background:rem<=2?C.dangerBg:C.priP}}>
                      <div className="card-rem" style={{fontSize:22,fontWeight:900,color:rem<=2?C.danger:C.priD,lineHeight:1}}>{rem}</div>
                      <div style={{fontSize:11,color:rem<=2?C.danger:C.txtL,fontWeight:600}}>잔여</div>
                    </div>
                    {exp&&<span style={{fontSize:12,color:C.danger,fontWeight:700}}>만료</span>}
                    <span style={{fontSize:18,color:C.priL}}>›</span>
                  </div>
                </button>
                <button onClick={()=>setHistM(m)} className="card-hist" style={{padding:"18px 16px",border:"none",borderLeft:`1.5px solid ${C.bdr}`,background:"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,minWidth:56,flexShrink:0}}>
                  <span style={{fontSize:18}}>📋</span><span style={{fontSize:10,color:C.txtL,fontWeight:600}}>기록</span>
                </button>
              </div>)})}
          </div>
          {paused.length>0&&<div style={{marginTop:26}}><p style={{fontSize:15,color:C.txtM,fontWeight:700,margin:"0 0 10px 4px"}}>⏸ 일시중지</p><div style={{display:"flex",flexDirection:"column",gap:8}}>{paused.map(m=>(<div key={m.id} style={{padding:"16px 20px",borderRadius:16,background:C.pauseBg,border:"1.5px solid #ddd",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><span style={{fontSize:16,fontWeight:700,color:C.pauseTxt}}>{m.name}</span>{m.pauseReason&&<span style={{fontSize:13,color:C.txtL,marginLeft:10}}>{m.pauseReason}</span>}</div><span style={{fontSize:13,background:C.warn,color:"white",padding:"4px 12px",borderRadius:10,fontWeight:600}}>중지</span></div>))}</div></div>}</>}
        </div>)}

        {/* SIGN */}
        {screen==="sign"&&sel&&(<div style={{animation:"fadeIn .3s ease"}}>
          <div style={{textAlign:"center",marginBottom:18}}>
            <p className="sign-name" style={{fontSize:24,fontWeight:800,color:C.txt,margin:"0 0 4px"}}>{sel.name}</p>
            <p style={{fontSize:15,color:C.txtM,margin:0,fontWeight:500}}>{fmt(td())} 수업 확인</p>
          </div>
          <InfoBar mb={sel} inst={instructors.find(x=>x.id===sel.instructorId)}/>
          {aI.length>1&&<SubSelect instructors={instructors} mid={sel.id} members={members} value={signI} onChange={setSignI}/>}
          <div style={{margin:"16px 0"}}><SigPad onSave={hSign} onCancel={goHome}/></div>
          {sRecs.length>0&&<div style={{marginTop:10}}><p style={{fontSize:15,color:C.txtM,margin:"0 0 10px 2px",fontWeight:700}}>📋 지난 수업</p><Hist records={sRecs} limit={5} instructors={instructors}/></div>}
        </div>)}

        {/* RESULT */}
        {screen==="result"&&sel&&<ResultScreen mb={sel} records={records} instructors={instructors} onDone={goHome}/>}
      </div>

      <div style={{textAlign:"center",padding:"12px 0 22px",fontSize:14,color:C.priL,fontWeight:800,letterSpacing:4}}>ODE TO PILATES</div>
      {histM&&<HistModal mb={histM} records={records} instructors={instructors} onClose={()=>setHistM(null)}/>}
      {showPin&&<PinInput onOk={()=>{setShowPin(false);setShowAdmin(true)}} onNo={()=>setShowPin(false)}/>}
      {showAdmin&&<Admin members={members} records={records} instructors={instructors} onUpM={upM} onUpR={upR} onUpI={upI} onClose={()=>setShowAdmin(false)} sUrl={sUrl} onSUrl={upSU} sync={sync} onSync={hSync}/>}
    </div>
  )
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
