function TimePick({value,onChange,takenTimes,compact,singleInst}){

/* Stamp */
function StampBar({total,used,animate,records,memberId,onDeleteNS}){const sz=total>12?26:total>8?30:36;const gap=total>12?4:total>8?5:7;const rem=total-used;
  const mr=(records||[]).filter(r=>r.memberId===memberId&&(r.type==="attended"||r.type==="noshow")).sort((a,b)=>(a.timestamp||"").localeCompare(b.timestamp||""));

      {Array.from({length:total}).map((_,i)=>{const rec=mr[i];const filled=i<used;const isLast=animate&&i===used-1;const isNS=rec?.type==="noshow";const col=isNS?C.stampNS:C.stamp;

function SigPad({onSave,onCancel}){const ref=useRef(null);const[dr,setDr]=useState(false);const[dn,setDn]=useState(false);

/* Clock Daily View — Large pizza chart */
function ClockView({schedule,date}){
  const sz=340;const cx=sz/2;const cy=sz/2;const outerR=sz/2-20;const innerR=sz/2-80;
  const startH=8,endH=22,total=endH-startH;
  const toRad=deg=>(deg*Math.PI)/180;
  const hAngle=h=>((h-startH)/total)*360-90;
  const arcPath=(r,a1,a2)=>{const ra1=toRad(a1),ra2=toRad(a2);const x1=cx+Math.cos(ra1)*r,y1=cy+Math.sin(ra1)*r;const x2=cx+Math.cos(ra2)*r,y2=cy+Math.sin(ra2)*r;return{x1,y1,x2,y2}};
  const hasSchedule=schedule.filter(m=>m.displayTime).length>0;
  return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"10px 0"}}>
    <div style={{fontSize:16,fontWeight:800,marginBottom:12,color:C.txt}}>{fmt(date)}</div>
    <div style={{position:"relative",width:sz+40,height:sz+40}}>
      <svg width={sz+40} height={sz+40} viewBox={`-20 -20 ${sz+40} ${sz+40}`}>
        {/* Outer ring */}
        <circle cx={cx} cy={cy} r={outerR} fill="#faf8f6" stroke={C.bdr} strokeWidth="2"/>
        <circle cx={cx} cy={cy} r={innerR} fill="white" stroke={C.bdr} strokeWidth="1"/>
        {/* Hour grid lines and labels 8~21 */}
        {Array.from({length:total}).map((_,i)=>{const h=startH+i;const a=hAngle(h);const ra=toRad(a);
          const ox=cx+Math.cos(ra)*outerR,oy=cy+Math.sin(ra)*outerR;
          const ix=cx+Math.cos(ra)*innerR,iy=cy+Math.sin(ra)*innerR;
          const lx=cx+Math.cos(ra)*(outerR+14),ly=cy+Math.sin(ra)*(outerR+14);
          const hasSess=schedule.some(m=>m.displayTime&&parseInt(m.displayTime)=== h);
          return(<g key={h}>
            <line x1={ix} y1={iy} x2={ox} y2={oy} stroke={C.bdr} strokeWidth="1" strokeDasharray={hasSess?"":"3 3"}/>
            <text x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="12" fontWeight={hasSess?"800":"500"} fill={hasSess?C.priD:C.txtL}>{h}</text>
          </g>)})}
        {/* Pizza slices for sessions */}
        {schedule.map((m,i)=>{if(!m.displayTime)return null;
          const hr=parseInt(m.displayTime.split(":")[0]);
          const a1=hAngle(hr),a2=hAngle(hr+1);
          const o1=arcPath(outerR-1,a1,a2),i1=arcPath(innerR+1,a1,a2);
          const mc=m.color||C.pri;
          const midA=toRad((a1+a2)/2);
          const labelR=(outerR+innerR)/2;
          const lx=cx+Math.cos(midA)*labelR,ly=cy+Math.sin(midA)*labelR;
          const fill=m.done?mc:m.noshow?C.noshow:mc;
          const opacity=m.done?1:m.noshow?.8:.25;
          return(<g key={m.id}>

function Calendar({members,records,instructors,onUpM}){

      result.push({...m,done,noshow:ns,isExtra:!!addOv&&!isDef,displayTime:dt,displayRoom:rm,instName:inst?.name||""})}});

  const moveClass=(mid,from,to)=>{if(!to)return;const m=members.find(x=>x.id===mid);if(!m)return;let nv=[...(m.scheduleOverrides||[])];const wdF=DK[new Date(from).getDay()];if(m.weeklyDays?.includes(wdF)){if(!nv.some(o=>o.date===from&&o.type==="remove"))nv.push({date:from,type:"remove"})}else nv=nv.filter(o=>!(o.date===from&&o.type==="add"));const wdT=DK[new Date(to).getDay()];if(m.weeklyDays?.includes(wdT))nv=nv.filter(o=>!(o.date===to&&o.type==="remove"));else{if(!nv.some(o=>o.date===to&&o.type==="add"))nv.push({date:to,type:"add",time:m.classTime||"",room:m.room||""})}onUpM(members.map(x=>x.id===mid?{...x,scheduleOverrides:nv}:x));setMoveMod(null)};
  const saveOv=(mid,ds,time,room)=>{const m=members.find(x=>x.id===mid);if(!m)return;let nv=[...(m.scheduleOverrides||[])];const idx=nv.findIndex(o=>o.date===ds);if(idx>=0){nv[idx]={...nv[idx],time,room}}else{const wd=DK[new Date(ds).getDay()];if(m.weeklyDays?.includes(wd))nv.push({date:ds,type:"timeChange",time,room});else{const ai=nv.findIndex(o=>o.date===ds&&o.type==="add");if(ai>=0)nv[ai]={...nv[ai],time,room}}}onUpM(members.map(x=>x.id===mid?{...x,scheduleOverrides:nv}:x))};

/* ═══ APP ═══ */
function App(){
  const[auth,setAuth]=useState(()=>sessionStorage.getItem("ode-auth")==="1");
  const[members,setMembers]=useState([]);const[records,setRecords]=useState([]);const[instructors,setInstructors]=useState([]);
  const[sel,setSel]=useState(null);const[screen,setScreen]=useState("select");const[adminOpen,setAdminOpen]=useState(false);
  const[loading,setLoading]=useState(true);const[loadMsg]=useState("구글 스프레드시트 동기화 중...");
  const[search,setSearch]=useState("");const[sortBy,setSortBy]=useState("expiry");const[filterI,setFilterI]=useState("all");
  const[sync,setSync]=useState("idle");const[histM,setHistM]=useState(null);const[signI,setSignI]=useState(null);const[surveyMb,setSurveyMb]=useState(null);
  const[calOpen,setCalOpen]=useState(false);

  const save=useCallback((m,r,i)=>{LS.set("ode-m",m);LS.set("ode-r",r);LS.set("ode-i",i);pushG(GS,m,r,i)},[]);
  const upM=useCallback(nm=>{setMembers(nm);save(nm,records,instructors)},[records,instructors,save]);
  const saveSurvey=(mid,data)=>{const nm=members.map(m=>m.id===mid?{...m,survey:data}:m);setMembers(nm);save(nm,records,instructors)};
  const upR=useCallback(nr=>{setRecords(nr);save(members,nr,instructors)},[members,instructors,save]);
  const upI=useCallback(ni=>{setInstructors(ni);save(members,records,ni)},[members,records,save]);

  const fullSync=useCallback(async(lm,lr,li)=>{setSync("syncing");const g=await pullG(GS);if(g?.success){const gm=g.members||[],gr=g.records||[],gi=g.instructors||[];const gIds=new Set(gm.map(x=>x.id));const fm=[...gm,...lm.filter(x=>!gIds.has(x.id))];const gTs=new Set(gr.map(x=>x.timestamp));const fr=[...gr,...lr.filter(x=>x.timestamp&&!gTs.has(x.timestamp))];const gI=new Set(gi.map(x=>x.id));const fi=[...gi,...li.filter(x=>!gI.has(x.id))];setMembers(fm);setRecords(fr);setInstructors(fi);LS.set("ode-m",fm);LS.set("ode-r",fr);LS.set("ode-i",fi);await pushG(GS,fm,fr,fi);setSync("success");setTimeout(()=>setSync("idle"),3000);return{m:fm,r:fr,i:fi}}setSync("error");setTimeout(()=>setSync("idle"),3000);return{m:lm,r:lr,i:li}},[]);

  useEffect(()=>{if(!auth){setLoading(false);return}const lm=LS.get("ode-m")||[],lr=LS.get("ode-r")||[],li=LS.get("ode-i")||[];setMembers(lm);setRecords(lr);setInstructors(li);if(lm.length||lr.length||li.length){setLoading(false);fullSync(lm,lr,li)}else{setLoading(true);fullSync(lm,lr,li).then(()=>setLoading(false)).catch(()=>setLoading(false))}},[auth]);
  const manualSync=useCallback(()=>{fullSync(members,records,instructors)},[members,records,instructors,fullSync]);

  const skipNS=r=>{const nr=records.map(x=>x.timestamp===r.timestamp?{...x,type:"skipped"}:x);const nm=members.map(m=>m.id===r.memberId?{...m,usedSessions:Math.max(0,m.usedSessions-1)}:m);setRecords(nr);setMembers(nm);save(nm,nr,instructors);setHistM(p=>p?nm.find(m=>m.id===p.id)||p:p)};
  const undoSkip=r=>{if(!confirm("스킵 취소 → 노쇼 복원"))return;const nr=records.map(x=>x.timestamp===r.timestamp?{...x,type:"noshow"}:x);const nm=members.map(m=>m.id===r.memberId?{...m,usedSessions:m.usedSessions+1}:m);setRecords(nr);setMembers(nm);save(nm,nr,instructors);setHistM(p=>p?nm.find(m=>m.id===p.id)||p:p)};
  const delNS=r=>{if(!confirm("삭제 + 횟수 복원"))return;const nr=records.filter(x=>x.timestamp!==r.timestamp);const nm=members.map(m=>m.id===r.memberId?{...m,usedSessions:Math.max(0,m.usedSessions-1)}:m);setRecords(nr);setMembers(nm);save(nm,nr,instructors);setHistM(p=>p?nm.find(m=>m.id===p.id)||p:p)};
  const delNSStamp=r=>{const nr=records.filter(x=>x.timestamp!==r.timestamp);const nm=members.map(m=>m.id===r.memberId?{...m,usedSessions:Math.max(0,m.usedSessions-1)}:m);setRecords(nr);setMembers(nm);save(nm,nr,instructors);setSel(p=>p?nm.find(m=>m.id===p.id)||p:p);setHistM(p=>p?nm.find(m=>m.id===p.id)||p:p)};
  const hNS=mid=>{const m=members.find(x=>x.id===mid);if(!m)return;const isF=m.usedSessions===0&&!m.firstClassDate;let um;if(isF){const exp=cExp(td(),m.totalSessions,m.weeklyDays);um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1,firstClassDate:td(),expiryDate:exp}:x)}else um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1}:x);const nr=[...records,{memberId:m.id,memberName:m.name,date:td(),type:"noshow",signature:null,instructorId:m.instructorId,isSubstitute:false,timestamp:new Date().toISOString()}];setMembers(um);setRecords(nr);save(um,nr,instructors);setSel(um.find(x=>x.id===m.id))};
  const hSign=sig=>{const m=members.find(x=>x.id===sel.id);if(!m)return;const isF=m.usedSessions===0&&!m.firstClassDate;let um;if(isF){const exp=cExp(td(),m.totalSessions,m.weeklyDays);um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1,firstClassDate:td(),expiryDate:exp}:x)}else um=members.map(x=>x.id===m.id?{...x,usedSessions:x.usedSessions+1}:x);const aId=signI||m.instructorId;const sub=aId&&aId!==m.instructorId;const nr=[...records,{memberId:m.id,memberName:m.name,date:td(),type:"attended",signature:sig,instructorId:aId||null,isSubstitute:sub,timestamp:new Date().toISOString()}];setMembers(um);setRecords(nr);save(um,nr,instructors);setSel(um.find(x=>x.id===m.id));setScreen("result");setSignI(null)};
  const goHome=()=>{setScreen("select");setSel(null);setSearch("");setSignI(null);setCalOpen(false);setAdminOpen(false)};
  const logout=()=>{sessionStorage.removeItem("ode-auth");setAuth(false)};

  if(!auth)return<LoginScreen onLogin={()=>setAuth(true)}/>;
  if(loading)return<LoadingGate msg={loadMsg}/>;

  const active=members.filter(m=>m.status==="active"),paused=members.filter(m=>m.status==="paused"),inactive=members.filter(m=>m.status==="inactive");
  const aI=instructors.filter(x=>x.status==="active");
  const sorted=[...active].sort((a,b)=>{if(sortBy==="expiry"){if(!a.expiryDate&&!b.expiryDate)return 0;if(!a.expiryDate)return 1;if(!b.expiryDate)return-1;return new Date(a.expiryDate)-new Date(b.expiryDate)}if(sortBy==="name")return a.name.localeCompare(b.name,"ko");if(sortBy==="remaining")return(a.totalSessions-a.usedSessions)-(b.totalSessions-b.usedSessions);return 0});
  const filtered=sorted.filter(m=>m.name.includes(search)).filter(m=>filterI==="all"||m.instructorId===filterI);

  return(<div className="app-wrap" style={{minHeight:"100vh",background:C.bg}}>
    <div style={{padding:"10px 14px",borderBottom:`1px solid ${C.bdr}`,background:"rgba(255,255,255,.75)",backdropFilter:"blur(10px)",display:"flex",justifyContent:"space-between",alignItems:"center",gap:4}}>
      <div style={{display:"flex",alignItems:"center",gap:6}}>{(screen!=="select"||calOpen||adminOpen)&&<Btn small onClick={goHome} style={{padding:"5px 8px",flexShrink:0}}>←</Btn>}<span style={{fontSize:13,fontWeight:900,color:C.priD,letterSpacing:2}}>ODE TO PILATES</span></div>
      <div style={{display:"flex",gap:4,alignItems:"center",flexShrink:0}}>
        <SyncDot s={sync}/>
        {screen==="select"&&!calOpen&&!adminOpen&&<button className="btn" onClick={()=>setCalOpen(true)} style={{width:32,height:32,borderRadius:9,border:`1.5px solid ${C.bdr}`,background:"white",color:C.inst,display:"flex",alignItems:"center",justifyContent:"center"}}><IcoCal sz={16}/></button>}
        {!adminOpen&&<Btn small onClick={()=>{setAdminOpen(true);setCalOpen(false);setScreen("select")}} style={{padding:"5px 12px",fontSize:11}}>관리</Btn>}
        <div style={{width:1,height:20,background:C.bdr,margin:"0 2px"}}/>
        <Btn small onClick={logout} style={{padding:"5px 8px",fontSize:10,color:C.txtL}}>로그아웃</Btn>
      </div>
    </div>
    <div style={{padding:"14px 12px",minHeight:"calc(100vh - 56px)",display:"flex",flexDirection:"column"}}>
      {calOpen&&screen==="select"&&!adminOpen&&<Calendar members={members} records={records} instructors={instructors} onUpM={upM}/>}
      {adminOpen&&<Admin members={members} records={records} instructors={instructors} onUpM={upM} onUpR={upR} onUpI={upI} sync={sync} onSync={manualSync} skipNS={skipNS} undoSkip={undoSkip} delNS={delNS}/>}
      {screen==="select"&&!calOpen&&!adminOpen&&<div className="af" style={{flex:1}}>
        <p style={{fontSize:15,color:C.txt,fontWeight:700,marginBottom:8,textAlign:"center"}}>이름을 선택해주세요</p>
        <input placeholder="검색" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,padding:"10px 14px",marginBottom:8}}/>
        <div style={{display:"flex",gap:3,flexWrap:"wrap",marginBottom:10,alignItems:"center"}}><select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{padding:"5px 8px",borderRadius:8,border:`1px solid ${C.bdr}`,fontSize:11,background:"white"}}><option value="expiry">만료임박순</option><option value="name">가나다순</option><option value="remaining">잔여적은순</option></select>{aI.length>0&&[{id:"all",name:"전체"},...aI].map(x=>(<Btn key={x.id} small onClick={()=>setFilterI(x.id)} style={{padding:"4px 10px",fontSize:10,background:filterI===x.id?(x.id==="all"?C.priD:C.inst):"white",color:filterI===x.id?"white":C.txtL,borderColor:filterI===x.id?(x.id==="all"?C.priD:C.inst):C.bdr}}>{x.name}</Btn>))}</div>
        {!members.length?<p style={{color:C.txtM,fontSize:13,textAlign:"center",padding:20}}>등록된 회원이 없습니다</p>:
        <><div style={{display:"flex",flexDirection:"column",gap:6}}>{filtered.map((m,i)=>{const rem=m.totalSessions-m.usedSessions;const exp=isExp(m.expiryDate);const off=rem<=0||exp;const days=dLeft(m.expiryDate);const inst=instructors.find(x=>x.id===m.instructorId);
          return(<div key={m.id} className="ar" style={{animationDelay:`${i*.03}s`,display:"flex",alignItems:"stretch",borderRadius:14,border:`1px solid ${off?"#f0c4bf":C.bdr}`,overflow:"hidden",background:off?"#FDF5F3":C.card,opacity:off?.4:1,borderLeft:`4px solid ${m.color||C.pri}`}}>
            <button className="card-act" onClick={()=>{if(off)return;setSel(m);setSignI(m.instructorId||null);setScreen("sign")}} style={{flex:1,display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 6px 12px 12px",border:"none",background:"transparent",textAlign:"left",minWidth:0}}>
              <div style={{flex:1,minWidth:0}}><div style={{display:"flex",alignItems:"baseline",gap:4,flexWrap:"wrap"}}><span style={{fontSize:15,fontWeight:800,color:C.txt}}>{m.name}</span><span style={{fontSize:12,fontWeight:400,color:C.txtL}}>회원님</span>{inst&&<Badge>{inst.name}</Badge>}</div>{m.weeklyDays?.length>0&&<div style={{fontSize:11,color:C.txtL,marginTop:1}}>주{m.weeklyDays.length}회 · {m.weeklyDays.join(" ")}{m.classTime?" · "+m.classTime:""}</div>}{m.expiryDate&&!exp&&days!==null&&days<=14&&<div style={{fontSize:11,color:days<=7?C.danger:C.warn,marginTop:1,fontWeight:600}}>~{fmtS(m.expiryDate)} ({days}일)</div>}</div>
              <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}><div style={{textAlign:"center",padding:"4px 8px",borderRadius:10,background:rem<=2?C.dangerBg:C.priP}}><div style={{fontSize:17,fontWeight:900,color:rem<=2?C.danger:C.priD,lineHeight:1}}>{rem}</div><div style={{fontSize:9,color:C.txtL,fontWeight:600}}>잔여</div></div><svg width="10" height="10" viewBox="0 0 24 24" fill="none" style={{opacity:.3}}><path d="M9 18l6-6-6-6" stroke={C.priL} strokeWidth="3" strokeLinecap="round"/></svg></div>
            </button>
            <button className="card-act" onClick={()=>setSurveyMb({...m,readOnly:true})} style={{padding:"6px",border:"none",borderLeft:`1px solid ${C.bdr}`,background:m.survey?"transparent":"transparent",display:"flex",alignItems:"center",justifyContent:"center",width:36,flexShrink:0,position:"relative"}}><IcoSurvey sz={13}/>{m.survey&&<span style={{position:"absolute",top:2,right:2,width:6,height:6,borderRadius:"50%",background:C.ok}}/>}</button>
            <button className="card-act" onClick={()=>setHistM(m)} style={{padding:"6px",border:"none",borderLeft:`1px solid ${C.bdr}`,background:"transparent",display:"flex",alignItems:"center",justifyContent:"center",width:36,flexShrink:0}}><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke={C.txtL} strokeWidth="1.5"/></svg></button>
          </div>)})}
        </div>
        {paused.length>0&&<div style={{marginTop:14}}><p style={{fontSize:12,color:C.txtM,fontWeight:700,margin:"0 0 5px"}}>일시중지</p>{paused.map(m=>(<div key={m.id} style={{padding:"8px 12px",borderRadius:10,background:C.pauseBg,border:"1px solid #ddd",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}><span style={{fontSize:13,fontWeight:700,color:C.pauseTxt}}>{m.name}</span><Badge color={C.warn} bg={C.warnBg}>중지</Badge></div>))}</div>}</>}
      </div>}
      {screen==="sign"&&sel&&<div className="af" style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",maxWidth:600,margin:"0 auto",width:"100%"}}>
        <div style={{textAlign:"center",marginBottom:10}}><p style={{fontSize:18,fontWeight:800,color:C.txt,margin:"0 0 4px"}}>{sel.name} <span style={{fontWeight:400,color:C.txtL,fontSize:14}}>회원님</span></p><p style={{fontSize:13,color:C.txtM,margin:0}}>{fmt(td())} 수업 확인</p></div>
        <StampBar total={sel.totalSessions} used={sel.usedSessions} records={records} memberId={sel.id} onDeleteNS={delNSStamp}/>
        <div style={{display:"flex",gap:8,marginBottom:6}}><div style={{flex:1,background:C.priP,borderRadius:14,padding:"8px",textAlign:"center",border:`1.5px solid ${C.bdr}`}}><div style={{fontSize:10,color:C.txtL}}>잔여</div><div style={{fontSize:22,fontWeight:900,color:(sel.totalSessions-sel.usedSessions)<=2?C.danger:C.priD,lineHeight:1}}>{sel.totalSessions-sel.usedSessions}<span style={{fontSize:10}}>회</span></div></div><div style={{flex:1.3,background:C.priP,borderRadius:14,padding:"8px",textAlign:"center",border:`1.5px solid ${C.bdr}`}}><div style={{fontSize:10,color:C.txtL}}>유효기간</div><div style={{fontSize:12,fontWeight:700,color:isExp(sel.expiryDate)?C.danger:C.txt}}>{isExp(sel.expiryDate)?"만료":sel.expiryDate?fmtShort(sel.expiryDate):"미정"}</div></div></div>
        {aI.length>1&&<SubSelect instructors={instructors} mid={sel.id} members={members} value={signI} onChange={setSignI}/>}
        <div style={{margin:"6px 0"}}><SigPad onSave={hSign} onCancel={goHome}/></div>
        <div style={{textAlign:"center",marginTop:4}}><button className="btn" onClick={()=>{if(confirm(`${sel.name} 회원님을 노쇼 처리합니다`)){hNS(sel.id);setScreen("result")}}} style={{padding:"8px 20px",borderRadius:10,border:`2px solid ${C.noshow}`,background:C.noshowBg,color:C.noshow,fontSize:12,fontWeight:700}}>NO SHOW 처리</button></div>
      </div>}
      {screen==="result"&&sel&&<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:"100%",maxWidth:500}}><ResultScreen mb={sel} records={records} onDone={goHome}/></div></div>}
    </div>
    <div style={{textAlign:"center",padding:"6px 0 12px",fontSize:10,color:C.priL,fontWeight:700,letterSpacing:3}}>ODE TO PILATES</div>
    {histM&&<HistModal mb={histM} records={records} instructors={instructors} onClose={()=>setHistM(null)} onSkip={skipNS} onUndoSkip={undoSkip} onDel={delNS} onDeleteNS={delNSStamp}/>}
    {surveyMb&&<SurveyModal mb={surveyMb} readOnly={true} onSave={data=>{saveSurvey(surveyMb.id,data);setSurveyMb(null)}} onClose={()=>setSurveyMb(null)}/>}
  </div>)
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
